    FROM events WHERE event_type IN ('memory_retrieve', 'memory_preference') AND timestamp > ?
    GROUP BY system HAVING sessions > 3
  description: Session 切换后偏好事件缺失，记忆一致性可能丢失

- id: DQT-090
  name: 多用户并发上下文一致性失败
