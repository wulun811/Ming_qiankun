    FROM events
    WHERE event_type='ying.tusunzip'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 3 AND avg_ratio < 0.3

- id: MEM-082
  name: "记忆检索延迟高"
  name_en: "High Memory Retrieval Latency"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "番天印记忆检索延迟超过 1 秒且有结果返回，检索性能告警"
  description_en: "Fantuan seal memory retrieval latency exceeds 1 second with results returned, retrieval performance warning"
  depends: {"event_types": ["ying.retrieve"], "fields": ["latency_ms", "results_count"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='ying.retrieve'
      AND json_extract(payload, '$.latency_ms') > 1000
      AND json_extract(payload, '$.results_count') > 0
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

