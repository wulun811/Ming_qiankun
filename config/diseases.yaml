- id: SYS-001
  name: "进程崩溃/消失"
  name_en: "Process Crash/Disappearance"
  layer: system
  severity: P0
  scope: observable
  applicable: all
  description: "进程意外消失，可能是 OOM、信号终止或人为 kill"
  description_en: "Process disappeared unexpectedly, possibly OOM, signal termination, or manual kill"
  depends: {"event_types": ["system_crash"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='system_crash' AND timestamp > ?
        GROUP BY system

- id: SYS-002
  name: "内存溢出（OOM）"
  name_en: "Memory Overflow (OOM)"
  layer: system
  severity: P0
  scope: observable
  applicable: all
  description: "进程内存溢出，通常是内存不足或内存泄漏导致"
  description_en: "Process memory overflow, usually caused by insufficient memory or memory leak"
  depends: {"event_types": ["error"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='error' AND timestamp > ?
        AND (json_extract(payload, '\1') LIKE '\1' OR json_extract(payload,
        '\1') LIKE '\1' OR json_extract(payload, '\1') LIKE
        '\1')
        GROUP BY system

- id: SYS-003
  name: "内存持续增长（泄漏）"
  name_en: "Persistent Memory Growth (Leak)"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "RSS 近期均值显著高于早期均值（≥1.8x），疑似内存持续泄漏而非正常波动"
  description_en: "Recent RSS mean significantly higher than early mean (≥1.8x), suspected persistent memory leak"
  depends: {"event_types": ["platform_snapshot"], "fields": ["vm_rss_kb"]}
  sql_template: |
    SELECT system,
      AVG(CASE WHEN timestamp > CAST(strftime('%s', 'now', '-15 minutes') AS REAL) THEN json_extract(payload, '$.vm_rss_kb') END) as recent_rss,
      AVG(CASE WHEN timestamp <= CAST(strftime('%s', 'now', '-15 minutes') AS REAL) THEN json_extract(payload, '$.vm_rss_kb') END) as early_rss
    FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
    AND system IN ('__host__', 'openclaw')
    GROUP BY system HAVING recent_rss > early_rss * 1.8

- id: SYS-004
  name: "虚拟内存异常膨胀"
  name_en: "Virtual Memory Abnormal Expansion"
  layer: system
  severity: P2
  scope: observable
  applicable: all
  description: "虚拟内存远超物理内存（Node.js 阈值 30GB，其他 5GB，容器环境下更宽容）"
  description_en: "Virtual memory far exceeds physical RAM (Node.js threshold 30GB, others 5GB, more lenient in containers)"
  env_thresholds: {"baremetal": {"swap_gap_node_kb": 31457280, "swap_gap_base_kb": 5242880}, "docker": {"swap_gap_node_kb": 41943040, "swap_gap_base_kb": 7340032}}
  depends: {"event_types": ["platform_snapshot"], "fields": ["proc_exe", "proc_name", "vm_rss_kb", "vm_size_kb"]}
  sql_template: |
    SELECT system,
           AVG(json_extract(payload, '$.vm_size_kb') - json_extract(payload, '$.vm_rss_kb')) as swap_gap,
           MAX(json_extract(payload, '$.proc_exe')) as proc_exe
    FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
    AND system IN ('__host__', 'openclaw')
    GROUP BY system
    HAVING swap_gap > IIF(MAX(json_extract(payload, '$.proc_exe')) LIKE '%node%' OR COALESCE(MAX(json_extract(payload, '$.proc_name')),'') LIKE '%node%', {env.swap_gap_node_kb}, {env.swap_gap_base_kb})

- id: SYS-005
  name: "文件描述符泄漏"
  name_en: "File Descriptor Leak"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "文件描述符数量持续增长，可能未正确关闭文件/连接"
  description_en: "File descriptor count keeps growing, files/connections may not be properly closed"
  depends: {"event_types": ["platform_snapshot"], "fields": ["fd_count"]}
  sql_template: |
    SELECT system, MIN(json_extract(payload, '$.fd_count')) as min_fd,
           MAX(json_extract(payload, '$.fd_count')) as max_fd
    FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
    AND system IN ('__host__', 'openclaw') AND json_extract(payload, '$.fd_count') > 0
    GROUP BY system HAVING max_fd > min_fd * 2 AND max_fd > 200

- id: SYS-006
  name: "线程爆炸"
  name_en: "Thread Explosion"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "线程数异常增长，可能导致上下文切换开销暴增"
  description_en: "Thread count growing abnormally, may cause context switching overhead spike"
  depends: {"event_types": ["platform_snapshot"], "fields": ["threads"]}
  sql_template: |
    SELECT system, MAX(json_extract(payload, '$.threads')) as max_threads
        FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
        AND system IN ('\1', '\1') AND json_extract(payload, '$.threads')
        > 0
        GROUP BY system HAVING max_threads > 200

- id: SYS-007
  name: "磁盘空间不足"
  name_en: "Insufficient Disk Space"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "磁盘剩余空间低于 500MB，可能导致日志写入失败"
  description_en: "Disk free space below 500MB, may cause log write failures"
  depends: {"event_types": ["__health__"], "fields": ["disk_free_mb"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.disk_free_mb') as free_mb
        FROM events WHERE event_type='__health__' AND timestamp > ?
        AND json_extract(payload, '$.disk_free_mb') < 500
        ORDER BY json_extract(payload, '$.disk_free_mb') ASC LIMIT 5

- id: SYS-008
  name: "静默异常（僵尸进程）"
  name_en: "Silent Exception (Zombie Process)"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "PID 存活但 10 分钟内无事件发出，可能已僵死"
  description_en: "PID alive but no events emitted in 10 minutes, possibly zombie process"
  depends: {"event_types": ["__health__", "platform_snapshot"]}
  sql_template: |
    SELECT system, MAX(timestamp) as last_event
        FROM events WHERE system != '\1' AND timestamp > ?
        GROUP BY system HAVING last_event < CAST(strftime('\1', '\1', '\1')
        AS REAL)

- id: SYS-009
  name: "时钟偏移"
  name_en: "Clock Skew"
  layer: system
  severity: P2
  scope: observable
  applicable: all
  disabled: true
  disabled_reason: "__health__ payload 结构已改变，无 _clock_skew 字段"
  description: "系统时钟与标准时间偏差过大，影响事件排序和诊断"
  description_en: "System clock deviates too far from standard time, affecting event ordering and diagnosis"
  depends: {"event_types": ["__health__"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='__health__' AND timestamp > ?
        AND json_extract(payload, '\1') = 1
        GROUP BY system

- id: SYS-010
  name: "IO 异常（异常文件打开）"
  name_en: "IO Anomaly (Abnormal File Open)"
  layer: system
  severity: P2
  scope: observable
  applicable: all
  description: "异常文件打开模式，可能是恶意行为或配置错误"
  description_en: "Abnormal file open pattern, possibly malicious behavior or misconfiguration"
  depends: {"event_types": ["io_anomaly"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='io_anomaly' AND timestamp > ?
        AND json_extract(payload, '\1') = '\1'
        GROUP BY system

- id: SYS-011
  name: "IO 写入量异常"
  name_en: "Abnormal IO Write Volume"
  layer: system
  severity: P2
  scope: observable
  applicable: all
  description: "短时间写入量暴增，可能是日志风暴或数据异常"
  description_en: "Write volume spike in short period, possibly log storm or data anomaly"
  depends: {"event_types": ["platform_snapshot"], "fields": ["io_write_bytes"]}
  sql_template: |
    SELECT system, MAX(json_extract(payload, '$.io_write_bytes')) as
        max_write
        FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
        AND system IN ('\1', '\1') AND json_extract(payload, '$.io_write_bytes')
        > 0
        GROUP BY system HAVING max_write > 1073741824

- id: SYS-012
  name: "IO 读取量异常"
  name_en: "Abnormal IO Read Volume"
  layer: system
  severity: P2
  scope: observable
  applicable: all
  description: "短时间读取量暴增，可能是缓存失效或全表扫描"
  description_en: "Read volume spike in short period, possibly cache invalidation or full table scan"
  depends: {"event_types": ["platform_snapshot"], "fields": ["io_read_bytes"]}
  sql_template: |
    SELECT system, MAX(json_extract(payload, '$.io_read_bytes')) as
        max_read
        FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
        AND system IN ('\1', '\1') AND json_extract(payload, '$.io_read_bytes')
        > 0
        GROUP BY system HAVING max_read > 1073741824

- id: SYS-013
  name: "归档器死亡"
  name_en: "Archiver Process Died"
  layer: system
  severity: P0
  scope: observable
  applicable: all
  description: "归档器心跳停止，事件无法持久化"
  description_en: "Archiver heartbeat stopped, events cannot be persisted"
  depends: {"event_types": ["__health__"]}
  sql_template: |
    SELECT 1 FROM events WHERE event_type='__health__' AND timestamp
        > ?
        LIMIT 1

- id: SYS-014
  name: "归档器心跳迟缓"
  name_en: "Archiver Heartbeat Sluggish"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "归档器 10 分钟内无心跳，可能存在性能瓶颈"
  description_en: "No archiver heartbeat for 10 minutes, possible performance bottleneck"
  depends: {"event_types": ["__health__"]}
  sql_template: |
    SELECT MAX(timestamp) as last_heartbeat FROM events
        WHERE event_type='__health__' AND timestamp > ?
        HAVING last_heartbeat < CAST(strftime('\1', '\1', '\1') AS REAL)

- id: SYS-015
  name: "探针监控中断"
  name_en: "Probe Monitoring Interrupted"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "探针主动断开监控连接，可能是被业务系统拒绝"
  description_en: "Probe actively disconnected monitoring, possibly rejected by business system"
  depends: {"event_types": ["__detach__"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='__detach__' AND timestamp > ?
        GROUP BY system

- id: SYS-016
  name: "Windows 指标不可靠"
  name_en: "Windows Metrics Unreliable"
  layer: system
  severity: P2
  scope: observable
  applicable: all
  description: "Windows 平台指标采集不完整，诊断精度受限"
  description_en: "Windows platform metric collection incomplete, diagnosis accuracy limited"
  depends: {"event_types": ["platform_snapshot"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='platform_snapshot' AND timestamp > ?
        AND json_extract(payload, '\1') = 1
        GROUP BY system

- id: SYS-017
  name: "CPU 负荷高"
  name_en: "High CPU Load"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "1 分钟负载超过 CPU 核心数的 80%，CPU 可能成为瓶颈"
  description_en: "1-minute load exceeds 80% of CPU cores, CPU may become bottleneck"
  depends: {"event_types": ["platform_snapshot"], "fields": ["cpu_count", "load_avg_1m"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.load_avg_1m') as load1,
           json_extract(payload, '$.cpu_count') as cpus
    FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
    AND json_extract(payload, '$.load_avg_1m') > 0
    AND json_extract(payload, '$.cpu_count') > 0
    AND json_extract(payload, '$.load_avg_1m') > json_extract(payload, '$.cpu_count') * 0.8
    GROUP BY system

- id: SYS-018
  name: "CPU 持续过载"
  name_en: "Sustained CPU Overload"
  layer: system
  severity: P0
  scope: observable
  applicable: all
  description: "5 分钟负载超过 CPU 核心数的 120%，系统持续过载，需立即干预"
  description_en: "5-minute load exceeds 120% of CPU cores, system persistently overloaded, immediate intervention needed"
  depends: {"event_types": ["platform_snapshot"], "fields": ["cpu_count", "load_avg_5m"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.load_avg_5m') as load5,
           json_extract(payload, '$.cpu_count') as cpus
    FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
    AND json_extract(payload, '$.load_avg_5m') > 0
    AND json_extract(payload, '$.cpu_count') > 0
    AND json_extract(payload, '$.load_avg_5m') > json_extract(payload, '$.cpu_count') * 1.2
    GROUP BY system

- id: SYS-019
  name: "CPU Load 异常飙升"
  name_en: "Abnormal CPU Load Spike"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "CPU 1 分钟 load 短时间内暴增 3 倍以上，可能存在 CPU 风暴"
  description_en: "CPU 1-minute load spiked 3x+ in short period, possible CPU storm"
  depends: {"event_types": ["platform_snapshot"], "fields": ["load_avg_1m"]}
  sql_template: |
    SELECT system,
      AVG(CASE WHEN timestamp > CAST(strftime('%s', 'now', '-5 minutes') AS REAL) THEN json_extract(payload, '$.load_avg_1m') END) as recent,
      AVG(CASE WHEN timestamp <= CAST(strftime('%s', 'now', '-5 minutes') AS REAL) THEN json_extract(payload, '$.load_avg_1m') END) as earlier
    FROM events WHERE event_type='platform_snapshot' AND timestamp > ?
    AND json_extract(payload, '$.load_avg_1m') > 0
    GROUP BY system HAVING recent > earlier * 3 AND recent > 2.0

- id: NET-017
  name: "网络不通（TCP 连接失败）"
  name_en: "Network Unreachable (TCP Connection Failed)"
  layer: network
  severity: P0
  scope: observable
  applicable: all
  description: "TCP 连接失败，网络不通或目标主机不可达"
  description_en: "TCP connection failed, network unreachable or target host unreachable"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') = 0
        GROUP BY system

- id: NET-018
  name: "网络不通（DNS 解析失败）"
  name_en: "Network Unreachable (DNS Resolution Failed)"
  layer: network
  severity: P0
  scope: observable
  applicable: all
  description: "DNS 解析失败，域名无法解析"
  description_en: "DNS resolution failed, domain name could not be resolved"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') = 0
        GROUP BY system

- id: NET-019
  name: "HTTP 4xx 客户端错误"
  name_en: "HTTP 4xx Client Error"
  layer: network
  severity: P2
  scope: observable
  applicable: all
  description: "HTTP 客户端错误频繁，可能是认证失败或参数错误"
  description_en: "Frequent HTTP client errors, possibly authentication failure or invalid parameters"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') BETWEEN 400 AND 499
        GROUP BY system

- id: NET-020
  name: "HTTP 5xx 服务端错误"
  name_en: "HTTP 5xx Server Error"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "HTTP 服务端错误频繁，目标服务可能不稳定"
  description_en: "Frequent HTTP server errors, target service may be unstable"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') BETWEEN 500 AND 599
        GROUP BY system

- id: NET-021
  name: "特定 Host 频繁失败"
  name_en: "Specific Host Frequent Failure"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "特定目标主机错误率超过 30%，该服务可能存在问题"
  description_en: "Error rate for specific target host exceeds 30%, service may have issues"
  depends: {"fields": ["layer_network.status_code", "layer_network.target_host"]}
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_network.target_host') as host,
           COUNT(*) as total,
           SUM(CASE WHEN json_extract(payload, '$.layer_network.status_code') >= 400 THEN 1 ELSE 0 END) as errors
    FROM events WHERE event_type IN ('llm_invoke', 'tool_call') AND timestamp > ?
    AND json_extract(payload, '$.layer_network.target_host') IS NOT NULL
    GROUP BY system, host HAVING errors * 1.0 / total > 0.3 AND total > 10

- id: NET-022
  name: "半开连接"
  name_en: "Half-Open Connections"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "TCP 连接成功但未收到 HTTP 响应，可能是半开连接"
  description_en: "TCP connected but no HTTP response received, possibly half-open connection"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') > 0
        AND json_extract(payload, '\1') IS NULL
        GROUP BY system

- id: NET-023
  name: "TLS 握手超时"
  name_en: "TLS Handshake Timeout"
  layer: network
  severity: P2
  scope: observable
  applicable: all
  description: "TLS 握手耗时超过 5 秒，证书验证或网络可能有问题"
  description_en: "TLS handshake took over 5 seconds, certificate validation or network may have issues"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') > 5000
        GROUP BY system

- id: NET-024
  name: "网络分区（非 LLM 延迟）"
  name_en: "Network Partition (Non-LLM Latency)"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "网络层连接失败导致 LLM 无响应，根因是网络分区而非模型延迟"
  description_en: "Network layer connection failure caused LLM to be unresponsive, root cause is network partition not model latency"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_llm.latency_ms", "layer_network.tcp_connected_ms"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='llm_invoke' AND timestamp > ?
        AND json_extract(payload, '$.layer_network.tcp_connected_ms') = 0
        AND json_extract(payload, '$.layer_llm.latency_ms') > 10000
        GROUP BY system

- id: NET-027
  name: "连接池耗尽"
  name_en: "Connection Pool Exhausted"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "同一目标主机并发连接数过高，可能连接池耗尽"
  description_en: "Concurrent connections to same target host too high, connection pool may be exhausted"
  depends: {"fields": ["layer_network.target_host"]}
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_network.target_host') as host,
           COUNT(*) as concurrent
    FROM events WHERE event_type IN ('llm_invoke', 'tool_call') AND timestamp > ?
    AND json_extract(payload, '$.layer_network.target_host') IS NOT NULL
    GROUP BY system, host, strftime('%s', datetime(timestamp, 'unixepoch')) / 10
    HAVING concurrent > 50

- id: NET-028
  name: "冷启动延迟"
  name_en: "Cold Start Latency"
  layer: network
  severity: P2
  scope: observable
  applicable: all
  description: "注册到首次业务事件间隔过长，冷启动延迟"
  description_en: "Long interval from registration to first business event, cold start delay"
  depends: {"event_types": ["llm_invoke", "__register__"]}
  sql_template: |
    SELECT system, 
           (SELECT MIN(timestamp) FROM events WHERE event_type='llm_invoke' AND system = r.system AND timestamp > maxts) - maxts as startup_delay
    FROM (SELECT system, MAX(timestamp) as maxts FROM events WHERE event_type='__register__' AND timestamp > ? GROUP BY system) r
    WHERE startup_delay IS NOT NULL AND startup_delay > 30

- id: NET-029
  name: "LLM Rate Limit（限流）"
  name_en: "LLM Rate Limit Exceeded"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "LLM API 返回 429，触发速率限制，需检查并发/配额/退避策略"
  description_en: "LLM API returned 429, rate limit triggered, check concurrency/quota/backoff strategy"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') = 429
        GROUP BY system

- id: NET-030
  name: "LLM 认证失败"
  name_en: "LLM Authentication Failed"
  layer: network
  severity: P0
  scope: observable
  applicable: all
  description: "LLM API 返回 401/403，API Key 过期或无权限，业务立即中断"
  description_en: "LLM API returned 401/403, API Key expired or no permission, service immediately interrupted"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as code, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') IN (401, 403)
        GROUP BY system, code

- id: NET-031
  name: "LLM 服务过载"
  name_en: "LLM Service Overloaded"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "LLM API 返回 503，服务端过载/维护，应切换降级或备用模型"
  description_en: "LLM API returned 503, server overloaded/maintenance, switch to degraded or fallback model"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') = 503
        GROUP BY system

- id: NET-032
  name: "LLM 服务端内部错误"
  name_en: "LLM Server Internal Error"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "LLM API 返回 500，服务端内部错误，可能模型推理异常或后端崩溃"
  description_en: "LLM API returned 500, server internal error, possible model inference error or backend crash"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type IN ('\1', '\1') AND timestamp > ?
        AND json_extract(payload, '\1') = 500
        GROUP BY system

- id: MDL-029
  name: "LLM 输出被截断"
  name_en: "LLM Output Truncated"
  layer: model
  severity: P2
  scope: observable
  applicable: all
  description: "LLM 输出因 token 限制被截断，可能需要增大 max_tokens"
  description_en: "LLM output truncated due to token limit, may need to increase max_tokens"
  depends: {"event_types": ["llm_invoke"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='llm_invoke' AND timestamp > ?
        AND json_extract(payload, '\1') LIKE '\1'
        GROUP BY system

- id: MDL-030
  name: "LLM 内容被过滤"
  name_en: "LLM Content Filtered"
  layer: model
  severity: P1
  scope: observable
  applicable: all
  description: "LLM 输出被内容过滤器拦截，可能触发安全策略"
  description_en: "LLM output blocked by content filter, security policy may have been triggered"
  depends: {"event_types": ["llm_invoke"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='llm_invoke' AND timestamp > ?
        AND json_extract(payload, '\1') LIKE '\1'
        GROUP BY system

- id: MDL-031
  name: "LLM 空返回"
  name_en: "LLM Empty Response"
  layer: model
  severity: P2
  scope: observable
  applicable: all
  description: "LLM 返回 200 但无输出内容，可能是提示词问题"
  description_en: "LLM returned 200 but no output content, possibly a prompt issue"
  depends: {"event_types": ["llm_invoke"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='llm_invoke' AND timestamp > ?
        AND json_extract(payload, '\1') = 0
        AND json_extract(payload, '\1') = 200
        GROUP BY system

- id: MDL-032
  name: "提示词臃肿"
  name_en: "Prompt Bloating"
  layer: model
  severity: P2
  scope: observable
  applicable: all
  description: "输入 token 远超输出，提示词可能过于冗长"
  description_en: "Input tokens far exceed output, prompt may be too verbose"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_llm.input_tokens", "layer_llm.output_tokens"]}
  sql_template: |
    SELECT system, AVG(json_extract(payload, '$.layer_llm.input_tokens') * 1.0 /
           NULLIF(json_extract(payload, '$.layer_llm.output_tokens'), 0)) as ratio
    FROM events WHERE event_type='llm_invoke' AND timestamp > ?
    AND json_extract(payload, '$.layer_llm.output_tokens') > 0
    GROUP BY system HAVING ratio > 60

- id: MDL-033
  name: "特定模型高延迟"
  name_en: "Specific Model High Latency"
  layer: model
  severity: P1
  scope: observable
  applicable: all
  description: "特定模型响应延迟超过 5 秒"
  description_en: "Specific model response latency exceeds 5 seconds"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_llm.latency_ms", "layer_llm.model"]}
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_llm.model') as model,
           COUNT(*) as cnt
    FROM events WHERE event_type='llm_invoke' AND timestamp > ?
    AND json_extract(payload, '$.layer_llm.latency_ms') > 30000
    GROUP BY system, model

- id: MDL-034
  name: "Latency 抖动异常"
  name_en: "Abnormal Latency Jitter"
  layer: model
  severity: P2
  scope: observable
  applicable: all
  description: "延迟波动范围超过均值 2 倍，服务可能不稳定"
  description_en: "Latency fluctuation exceeds 2x the mean, service may be unstable"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_llm.latency_ms"]}
  sql_template: |
    SELECT system,
           AVG(json_extract(payload, '$.layer_llm.latency_ms')) as avg_lat,
           MAX(json_extract(payload, '$.layer_llm.latency_ms')) - MIN(json_extract(payload, '$.layer_llm.latency_ms')) as lat_range
    FROM events WHERE event_type='llm_invoke' AND timestamp > ?
    GROUP BY system HAVING lat_range > avg_lat * 5

- id: MDL-035
  name: "无限循环与思考瘫痪"
  name_en: "Infinite Loop and Thinking Paralysis"
  layer: model
  severity: P0
  scope: observable
  applicable: all
  description: "同一决策步骤高频重复，疑似循环、震荡或缺乏终止条件"
  description_en: "Same decision step repeated at high frequency, suspected loop, oscillation, or missing termination condition"
  depends: {"event_types": ["agent_step"], "fields": ["layer_agent.step_id"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.layer_agent.step_id') as
        sid, COUNT(*) as c
        FROM events WHERE event_type='agent_step' AND timestamp > ?
        GROUP BY system, sid HAVING c > 5

- id: MDL-036
  name: "推理成本失控"
  name_en: "Runaway Inference Cost"
  layer: model
  severity: P1
  scope: observable
  applicable: all
  description: "Token 消耗超过阈值，检查循环调用、模型降级或长文本输入"
  description_en: "Token consumption exceeds threshold, check for loop calls, model degradation, or long text input"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_llm.input_tokens", "layer_llm.output_tokens"]}
  sql_template: |
    SELECT system,
           SUM(json_extract(payload, '$.layer_llm.input_tokens') +
                json_extract(payload, '$.layer_llm.output_tokens')) as tokens,
           COUNT(*) as cnt
    FROM events WHERE event_type='llm_invoke' AND timestamp > ?
    GROUP BY system HAVING tokens > 500000

- id: MDL-037
  name: "大规模注意力稀释"
  name_en: "Large-Scale Attention Dilution"
  layer: model
  severity: P2
  scope: observable
  applicable: all
  description: "输入 token 持续接近模型上限，注意力可能稀释"
  description_en: "Input tokens consistently near model limit, attention may be diluted"
  depends: {"event_types": ["llm_invoke"]}
  sql_template: |
    SELECT system, AVG(json_extract(payload, '\1'))
        as avg_tokens
        FROM events WHERE event_type='llm_invoke' AND timestamp > ?
        GROUP BY system HAVING avg_tokens > 100000

- id: MDL-038
  name: "静默成本与空转浪费"
  name_en: "Silent Cost and Idle Waste"
  layer: model
  severity: P1
  scope: observable
  applicable: all
  description: "LLM 调用高频但无工具调用或 agent 步骤产出，可能空转"
  description_en: "High-frequency LLM calls but no tool calls or agent step output, possible idling"
  depends: {"event_types": ["llm_invoke"]}
  sql_template: |
    SELECT system, COUNT(*) as llm_cnt FROM events
    WHERE event_type='llm_invoke' AND timestamp > ?
    AND NOT EXISTS (
      SELECT 1 FROM events e2
      WHERE e2.system = events.system
      AND e2.event_type IN ('tool_call', 'agent_step')
      AND e2.timestamp > ?
    )
    GROUP BY system HAVING llm_cnt > 50

- id: TLT-039
  name: "工具调用超时"
  name_en: "Tool Call Timeout"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "工具调用超时，依赖服务可能不可用"
  description_en: "Tool call timed out, dependent service may be unavailable"
  depends: {"event_types": ["tool_call"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='tool_call' AND timestamp > ?
        AND json_extract(payload, '\1') = '\1'
        GROUP BY system

- id: TLT-040
  name: "工具输入重复（缓存失效）"
  name_en: "Tool Input Duplication (Cache Invalidation)"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "相同工具输入 5 分钟内重复超过 3 次，缓存可能失效"
  description_en: "Same tool input repeated over 3 times in 5 minutes, cache may be invalid"
  depends: {"event_types": ["tool_call"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as h, COUNT(*) as cnt
        FROM events WHERE event_type='tool_call' AND timestamp > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system, h HAVING cnt > 3

- id: TLT-051
  name: "LLM 重复输出（内容哈希重复）"
  name_en: "LLM Duplicate Output (Content Hash Repeated)"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "同一 Session 内 5 分钟内相同输出内容重复超过 3 次，疑似 LLM 重复说话"
  description_en: "Same output content repeated over 3 times in 5 minutes within same session, suspected LLM repetition"
  depends: {"event_types": ["llm_output"], "fields": ["layer_agent.session_id", "layer_llm.output_text_hash"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.layer_agent.session_id') as session_id,
           json_extract(payload, '$.layer_llm.output_text_hash') as text_hash,
           COUNT(*) as repeat_count,
           MIN(timestamp) as first_seen,
           MAX(timestamp) as last_seen
    FROM events
    WHERE event_type='llm_output'
      AND timestamp > ?
      AND json_extract(payload, '$.layer_llm.output_text_hash') IS NOT NULL
    GROUP BY system, session_id, text_hash
    HAVING repeat_count >= 3
       AND (MAX(timestamp) - MIN(timestamp)) < 300

- id: TLT-052
  name: "长时间无响应（思考停滞）"
  name_en: "Prolonged Non-Response (Thought Stagnation)"
  layer: model
  severity: P1
  scope: observable
  applicable: all
  description: "Agent 步骤开始后超过 2 分钟未完成，疑似思考停滞或卡死"
  description_en: "Agent step not completed after 2 minutes, suspected thinking stall or freeze"
  depends: {"event_types": ["agent_step_start", "agent_step_finish"]}
  sql_template: |
    SELECT s.system,
               json_extract(s.payload, '$.layer_agent.step_id') as step_id,
               s.timestamp as step_start_time
        FROM events s
        WHERE s.event_type='agent_step_start'
          AND s.timestamp > ?
          AND s.system IN ('opencode', 'crewai', 'langchain-js')
          AND json_extract(s.payload, '$.layer_agent.step_id') IS NOT NULL
          AND (strftime('%s', 'now') - s.timestamp) > 120
          AND NOT EXISTS (
            SELECT 1 FROM events f
            WHERE f.event_type='agent_step_finish'
              AND f.system = s.system
              AND json_extract(f.payload, '$.layer_agent.step_id') = json_extract(s.payload, '$.layer_agent.step_id')
              AND f.timestamp > s.timestamp
          )

- id: TLT-041
  name: "工具 Latency 异常高"
  name_en: "Abnormally High Tool Latency"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "工具执行耗时超过 10 秒，即使成功也异常"
  description_en: "Tool execution took over 10 seconds, abnormal even if successful"
  depends: {"event_types": ["tool_call"], "fields": ["layer_tool.execution_ms", "layer_tool.tool_name"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.layer_tool.tool_name') as tool,
           json_extract(payload, '$.layer_tool.execution_ms') as exec_ms
    FROM events WHERE event_type='tool_call' AND timestamp > ?
    AND json_extract(payload, '$.layer_tool.execution_ms') > 10000

- id: TLT-042
  name: "未知工具调用"
  name_en: "Unknown Tool Call"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "检测到不在白名单中的工具调用 — 暂不启用（乾坤镜不做第三方工具围栏）"
  description_en: "Detected tool call not in whitelist — temporarily disabled (Mingjing does not fence third-party tools)"
  depends: {"event_types": ["tool_call"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as tool, COUNT(*) as cnt
        FROM events WHERE event_type='tool_call' AND timestamp > ?
        GROUP BY system, tool ORDER BY cnt DESC LIMIT 20

- id: TLT-043
  name: "工具成功但下游失败"
  name_en: "Tool Succeeds but Downstream Fails"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "工具调用成功但后续发生错误事件，可能存在下游依赖问题"
  description_en: "Tool call succeeded but subsequent error event occurred, possible downstream dependency issue"
  depends: {"event_types": ["error"], "fields": ["error_type"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='error' AND timestamp > ?
    AND json_extract(payload, '$.error_type') NOT LIKE '%test%'
    AND EXISTS (
      SELECT 1 FROM events e2
      WHERE e2.system = events.system
      AND e2.event_type = 'tool_call'
      AND e2.timestamp > ?
      AND json_extract(e2.payload, '$.layer_tool.tool_status') = 'success'
    )
    GROUP BY system

- id: TLT-044
  name: "工具权限不足"
  name_en: "Insufficient Tool Permissions"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "工具调用因权限不足失败"
  description_en: "Tool call failed due to insufficient permissions"
  depends: {"event_types": ["error"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='error' AND timestamp > ?
        AND (json_extract(payload, '\1') LIKE '\1' OR json_extract(payload,
        '\1') LIKE '\1')
        GROUP BY system

- id: TLT-045
  name: "工具调用格式错误"
  name_en: "Malformed Tool Call"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "工具调用参数格式错误"
  description_en: "Tool call parameter format error"
  depends: {"event_types": ["error"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='error' AND timestamp > ?
        AND (json_extract(payload, '\1') LIKE '\1' OR json_extract(payload,
        '\1') LIKE '\1')
        GROUP BY system

- id: TLT-046
  name: "工具选择不当"
  name_en: "Inappropriate Tool Selection"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "工具频繁失败（3次以上），可能是选错工具或参数不当"
  description_en: "Tool fails frequently (3+ times), possibly wrong tool or improper parameters"
  depends: {"event_types": ["tool_call"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as tool, COUNT(*) as cnt
        FROM events WHERE event_type='tool_call' AND timestamp > ?
        AND json_extract(payload, '\1') = '\1'
        GROUP BY system, tool HAVING cnt >= 3

- id: TLT-047
  name: "工具连续失败"
  name_en: "Consecutive Tool Failures"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "同一工具 5 分钟内连续失败超过 3 次"
  description_en: "Same tool failed consecutively over 3 times in 5 minutes"
  depends: {"event_types": ["tool_call"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as tool, COUNT(*) as fails
        FROM events WHERE event_type='tool_call' AND timestamp > ?
        AND json_extract(payload, '\1') = '\1'
        GROUP BY system, tool HAVING fails > 3

- id: TLT-048
  name: "工具权限失控"
  name_en: "Tool Permission Escalation"
  layer: tool
  severity: P0
  scope: observable
  applicable: all
  description: "Agent 调用高危工具，需立即检查权限配置与 guardrail 拦截"
  description_en: "Agent called a high-risk tool, immediately check permission configuration and guardrail interception"
  depends: {"event_types": ["tool_call"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as tool, COUNT(*) as cnt
        FROM events WHERE event_type='tool_call' AND timestamp > ?
        AND json_extract(payload, '\1') IN ('\1',
        '\1', '\1', '\1', '\1')
        GROUP BY system, tool

- id: TLT-049
  name: "多工具协同困难"
  name_en: "Multi-Tool Coordination Difficulty"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "工具调用种类过多，可能存在协同困难"
  description_en: "Too many tool call types, possible coordination difficulty"
  depends: {"event_types": ["tool_call"]}
  sql_template: |
    SELECT system, COUNT(DISTINCT json_extract(payload, '\1'))
        as tool_count
        FROM events WHERE event_type='tool_call' AND timestamp > ?
        GROUP BY system HAVING tool_count > 10

- id: TLT-050
  name: "策划步骤冗余与无效劳动"
  name_en: "Redundant Planning Steps and Waste"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "策划步骤过多且无有效产出，可能存在冗余劳动"
  description_en: "Too many planning steps with no effective output, possible redundant work"
  depends: {"event_types": ["agent_step"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='agent_step' AND timestamp > ?
        GROUP BY system HAVING cnt > 100

- id: AGT-049
  name: "预期事件缺失"
  name_en: "Expected Event Missing"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "探针可能未覆盖该路径，或执行失败，或事件在异步/子进程中丢失"
  description_en: "Probe may not cover this path, execution may have failed, or events lost in async/subprocess"
  depends: {"fields": []}
  sql_template: |
    SELECT system, expected_event FROM expectations
        WHERE fulfilled=0 AND deadline < ?

- id: AGT-051
  name: "Session 管理混乱"
  name_en: "Session Management Chaos"
  layer: agent
  severity: P1
  scope: observable
  applicable: all
  description: "Session ID 频繁跳变或为 NULL，会话管理可能混乱"
  description_en: "Session ID frequently jumps or is NULL, session management may be chaotic"
  depends: {"event_types": ["agent_step", "llm_invoke"]}
  sql_template: |
    SELECT system, COUNT(DISTINCT json_extract(payload, '\1'))
        as session_count
        FROM events WHERE event_type IN ('\1', '\1') AND timestamp
        > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system HAVING session_count > 20

- id: AGT-052
  name: "Step 跳跃（步骤缺失）"
  name_en: "Step Skipping (Missing Steps)"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "步骤 ID 序列不连续，可能存在步骤缺失 — 暂不启用（需解析复合 step_id 做 gap 检测，当前 SQL 无法支持）"
  description_en: "Step ID sequence discontinuous, possible missing steps — disabled (needs compound step_id gap detection, not supported by current SQL)"
  depends: {"event_types": ["agent_step"], "fields": ["layer_agent.step_id"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.layer_agent.step_id') as
        sid, COUNT(*) as cnt
        FROM events WHERE event_type='agent_step' AND timestamp > ?
        GROUP BY system, sid ORDER BY cnt DESC LIMIT 20

- id: AGT-053
  name: "决策黑盒"
  name_en: "Decision Black Box"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "Agent 决策摘要为空或过短，决策过程不透明"
  description_en: "Agent decision summary is empty or too short, decision process is opaque"
  depends: {"event_types": ["agent_step"], "fields": ["layer_agent.decision_summary"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='agent_step' AND timestamp > ?
    AND (json_extract(payload, '$.layer_agent.decision_summary') IS NULL
         OR LENGTH(json_extract(payload, '$.layer_agent.decision_summary')) < 10)
    GROUP BY system

- id: AGT-054
  name: "单 Session 步骤过多"
  name_en: "Excessive Steps in Single Session"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "同一 Session 内步骤超过 100，可能陷入死循环"
  description_en: "Over 100 steps in the same session, may be stuck in an infinite loop"
  depends: {"event_types": ["agent_step"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as sid, COUNT(*) as cnt
        FROM events WHERE event_type='agent_step' AND timestamp > ?
        GROUP BY system, sid HAVING cnt > 100

- id: AGT-055
  name: "Step ID 重复（非循环）"
  name_en: "Step ID Duplicate (Non-Loop)"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "同一 Session 内 Step ID 重复，可能非循环导致"
  description_en: "Duplicate Step ID within the same session, not necessarily caused by a loop"
  depends: {"event_types": ["agent_step"], "fields": ["layer_agent.session_id", "layer_agent.step_id"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.layer_agent.step_id') as sid,
           json_extract(payload, '$.layer_agent.session_id') as session,
           COUNT(*) as cnt
    FROM events WHERE event_type='agent_step' AND timestamp > ?
    GROUP BY system, sid, session HAVING cnt > 1

- id: AGT-056
  name: "角色边界侵蚀"
  name_en: "Role Boundary Erosion"
  layer: agent
  severity: P1
  scope: observable
  applicable: all
  description: "Agent 角色与事件类型不匹配，可能存在边界侵蚀 — 暂不启用（需角色/事件映射表，当前 Schema 无法支持）"
  description_en: "Agent role mismatches event type, possible boundary erosion — disabled (needs role/event mapping table, not supported by current schema)"
  depends: {"event_types": ["agent_step"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1') as role,
        COUNT(*) as cnt
        FROM events WHERE event_type='agent_step' AND timestamp > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system, role

- id: AGT-057
  name: "并发一致性冲突"
  name_en: "Concurrent Consistency Conflict"
  layer: agent
  severity: P0
  scope: observable
  applicable: all
  description: "多 Session 事件串扰，可能存在并发一致性冲突"
  description_en: "Cross-session event crosstalk, possible concurrency consistency conflict"
  depends: {"event_types": ["agent_step", "llm_invoke"]}
  sql_template: |
    SELECT system, COUNT(DISTINCT json_extract(payload, '\1'))
        as sessions
        FROM events WHERE event_type IN ('\1', '\1') AND timestamp
        > ?
        GROUP BY system HAVING sessions > 5

- id: AGT-058
  name: "多 Agent 通信开销爆炸"
  name_en: "Multi-Agent Communication Overhead Explosion"
  layer: agent
  severity: P1
  scope: observable
  applicable: all
  description: "LLM 调用频次和 Token 消耗呈 O(N²) 增长"
  description_en: "LLM call frequency and token consumption growing at O(N²)"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_agent.session_id"]}
  sql_template: |
    SELECT system, MAX(session_llm_cnt) as max_session_llm
    FROM (
      SELECT system,
             json_extract(payload, '$.layer_agent.session_id') as session_id,
             COUNT(*) as session_llm_cnt
      FROM events WHERE event_type='llm_invoke' AND timestamp > ?
      GROUP BY system, session_id
    )
    GROUP BY system
    HAVING max_session_llm > 400

- id: AGT-059
  name: "多 Agent 故障隔离失败"
  name_en: "Multi-Agent Fault Isolation Failed"
  layer: agent
  severity: P0
  scope: observable
  applicable: all
  description: "跨系统故障传播，单点故障影响多个 Agent"
  description_en: "Cross-system fault propagation, single point of failure affects multiple agents"
  depends: {"event_types": ["error"]}
  sql_template: |
    SELECT COUNT(DISTINCT system) as affected_systems, COUNT(*) as cnt
        FROM events WHERE event_type='error' AND timestamp > ?
        HAVING affected_systems > 2

- id: AGT-060
  name: "任务分配不合理与负载失衡"
  name_en: "Unreasonable Task Distribution and Load Imbalance"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "某系统 agent_step 远高于窗口均值（>2.5x），负载分配不均"
  description_en: "System agent_step far above window mean (>2.5x), uneven load distribution"
  depends: {"event_types": ["agent_step"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='agent_step' AND timestamp > ?
        GROUP BY system HAVING cnt > (SELECT AVG(sub.cnt) FROM (SELECT COUNT(*) as cnt
        FROM events WHERE event_type='agent_step' AND timestamp > ? GROUP BY system)
        sub) * 2.5

- id: AGT-061
  name: "并行任务处理混乱"
  name_en: "Parallel Task Processing Chaos"
  layer: agent
  severity: P1
  scope: observable
  applicable: all
  description: "多 Session 事件交织，并行任务处理可能混乱"
  description_en: "Multiple session events interleaved, parallel task handling may be chaotic"
  depends: {"event_types": ["agent_step", "llm_invoke"]}
  sql_template: |
    SELECT system, COUNT(DISTINCT json_extract(payload, '\1'))
        as sessions
        FROM events WHERE event_type IN ('\1', '\1') AND timestamp
        > ?
        GROUP BY system HAVING sessions > 3

- id: AGT-062
  name: "错误传播与级联崩盘"
