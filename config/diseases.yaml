- id: PRB-084
  name: "探针 emit 率异常"
  name_en: "Abnormal Probe Emit Rate"
  layer: probe
  severity: P2
  scope: observable
  applicable: all
  description: "探针 emit 成功率突降（注意：emit_success_count_1m 在不同探针实现中语义不同 — OpenClaw/opencode"
  description_en: "Probe emit success rate dropped sharply (note: emit_success_count_1m semantics differ across probe implementations — OpenClaw/opencode"
  depends: {"event_types": ["__health__"], "fields": ["emit_success_count_1m"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.emit_success_count_1m') as emit_rate
    FROM events WHERE event_type='__health__' AND timestamp > ?
    AND json_extract(payload, '$.emit_success_count_1m') IS NOT NULL
    AND json_extract(payload, '$.emit_success_count_1m') < 2
    AND EXISTS (
      SELECT 1 FROM events e2
      WHERE e2.system = events.system
      AND e2.event_type NOT IN ('__health__', '__register__')
      AND e2.timestamp > ?
    )
    ORDER BY emit_rate ASC LIMIT 5

