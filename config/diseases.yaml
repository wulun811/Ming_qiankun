  description_en: "TusunZip compression ratio consistently below 0.3, compression effectiveness significantly degraded"
  depends: {"event_types": ["ying.tusunzip"], "fields": ["ratio"]}
  sql_template: |
    SELECT system, AVG(json_extract(payload, '$.ratio')) as avg_ratio,
