- id: AGT-066
  name: "请求生命周期断裂"
  name_en: "Request Lifecycle Broken"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "请求 start 事件明显多于 end 事件，存在请求无法正常完成的异常"
  description_en: "Request start events significantly outnumber end events, requests failing to complete normally"
  depends: {"event_types": ["request.end", "request.start"]}
  sql_template: |
    SELECT system,
           SUM(CASE WHEN event_type='request.start' THEN 1 ELSE 0 END) as start_cnt,
           SUM(CASE WHEN event_type='request.end' THEN 1 ELSE 0 END) as end_cnt
    FROM events
    WHERE event_type IN ('request.start', 'request.end')
      AND timestamp > ?
    GROUP BY system
    HAVING start_cnt > end_cnt + 3

- id: MDL-039
  name: "LLM 空转（无工具调用）"
  name_en: "LLM Idle (No Tool Calls)"
  layer: model
  severity: P1
  scope: observable
  applicable: all
  description: "LLM 多次调用但无工具调用跟进，可能存在推理循环或死锁"
  description_en: "Multiple LLM calls with no tool call follow-up, possible reasoning loop or deadlock"
  depends: {"event_types": ["llm_invoke", "tool_call"]}
  sql_template: |
    SELECT system,
           SUM(CASE WHEN event_type='llm_invoke' THEN 1 ELSE 0 END) as llm_cnt,
           SUM(CASE WHEN event_type='tool_call' THEN 1 ELSE 0 END) as tool_cnt
    FROM events
    WHERE event_type IN ('llm_invoke', 'tool_call')
      AND timestamp > ?
    GROUP BY system
    HAVING llm_cnt >= 3 AND tool_cnt = 0

- id: MDL-040
  name: "模型 API 密钥未配置"
  name_en: "Model API Key Not Configured"
  layer: model
  severity: P0
  scope: observable
  applicable: all
  description: "模型 API 密钥未配置或已失效，LLM 调用将全部失败"
  description_en: "Model API key not configured or expired, all LLM calls will fail"
  depends: {"event_types": ["error"], "fields": ["error_msg", "message"]}
  always_on: true
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='error'
      AND (json_extract(payload, '$.error_msg') LIKE '%No API key%'
           OR json_extract(payload, '$.error_msg') LIKE '%no api key%'
           OR json_extract(payload, '$.message') LIKE '%No API key%'
           OR json_extract(payload, '$.message') LIKE '%no api key%')
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

- id: AGT-067
  name: "Agent 达到最大轮次"
  name_en: "Agent Reached Max Turns"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "Agent 达到最大推理轮次限制，任务被迫中止"
  description_en: "Agent reached maximum reasoning turn limit, task forcibly terminated"
  depends: {"event_types": ["error"], "fields": ["error_msg", "message"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='error'
      AND (json_extract(payload, '$.error_msg') LIKE '%Max turns%'
           OR json_extract(payload, '$.error_msg') LIKE '%max turns%'
           OR json_extract(payload, '$.message') LIKE '%Max turns%'
           OR json_extract(payload, '$.message') LIKE '%max turns%')
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

- id: SYS-032
  name: "Token 消耗突增"
  name_en: "Token Consumption Spike"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "近 5 分钟 Token 消耗超过基准（近 60 分钟均值）的 3 倍，存在调用量异常突增"
  description_en: "Token consumption in last 5 minutes exceeds 3x baseline (60-min mean), abnormal call volume spike"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_llm.input_tokens", "layer_llm.output_tokens"]}
  always_on: true
  sql_template: |
    SELECT system,
      SUM(CASE WHEN timestamp > CAST(strftime('%s', 'now', '-5 minutes') AS REAL) THEN json_extract(payload, '$.layer_llm.input_tokens') + json_extract(payload, '$.layer_llm.output_tokens') ELSE 0 END) AS recent_tokens,
      AVG(CASE WHEN timestamp <= CAST(strftime('%s', 'now', '-5 minutes') AS REAL) THEN json_extract(payload, '$.layer_llm.input_tokens') + json_extract(payload, '$.layer_llm.output_tokens') ELSE NULL END) AS baseline_tokens
    FROM events
    WHERE event_type='llm_invoke'
      AND timestamp > ?
    GROUP BY system
    HAVING recent_tokens > baseline_tokens * 3.0 AND baseline_tokens > 0 AND recent_tokens > 1000

- id: TLT-058
  name: "危险工具调用"
  name_en: "Dangerous Tool Call"
  layer: tool
  severity: P0
  scope: observable
  applicable: all
  description: "检测到 Agent 调用了高风险系统命令或危险操作，可能造成不可逆影响"
  description_en: "Agent detected calling high-risk system commands or dangerous operations, may cause irreversible impact"
  depends: {"event_types": ["tool_call"], "fields": ["layer_tool.execution_ms", "layer_tool.tool_args", "layer_tool.tool_name", "layer_tool.tool_result", "layer_tool.tool_status"]}
  always_on: true
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_tool.tool_name') AS tool,
           json_extract(payload, '$.layer_tool.tool_args') AS args,
           json_extract(payload, '$.layer_tool.tool_result') AS result,
           json_extract(payload, '$.layer_tool.tool_status') AS status,
           json_extract(payload, '$.layer_tool.execution_ms') AS exec_ms,
           timestamp
    FROM events
    WHERE event_type='tool_call'
      AND json_extract(payload, '$.layer_tool.tool_name') IN ('rm', 'unlink', 'exec', 'sudo', 'rm_rf', 'git_force_push', 'db_drop', 'chmod_777', 'eval')
      AND timestamp > ?
    ORDER BY timestamp DESC
    LIMIT 50

- id: TLT-059
  name: "工具副作用过大"
  name_en: "Excessive Tool Side Effects"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "工具调用次数超过 Agent 推理步数的 5 倍，工具使用密度过高（文档污染/权限失控前兆）"
  description_en: "Tool calls exceed 5x agent reasoning steps, tool usage density too high (precursor to document pollution/permission loss)"
  depends: {"event_types": ["agent_step", "tool_call"]}
  always_on: true
  sql_template: |
    SELECT system,
      SUM(CASE WHEN event_type='tool_call' THEN 1 ELSE 0 END) AS tool_cnt,
      SUM(CASE WHEN event_type='agent_step' THEN 1 ELSE 0 END) AS step_cnt
    FROM events
    WHERE event_type IN ('tool_call', 'agent_step')
      AND timestamp > ?
    GROUP BY system
    HAVING tool_cnt * 1.0 / NULLIF(step_cnt, 0) > 5.0

- id: AGT-068
  name: "Step 序列循环"
  name_en: "Step Sequence Loop"
  layer: agent
  severity: P1
  scope: observable
  applicable: all
  description: "Agent 推理步骤 ID 去重率低于 20%，存在 step_id 高度重复的死循环迹象"
  description_en: "Agent reasoning step ID dedup rate below 20%, signs of infinite loop with highly repeated step_ids"
  depends: {"event_types": ["agent_step"], "fields": ["layer_agent.step_id"]}
  always_on: true
  sql_template: |
    SELECT system,
      COUNT(DISTINCT json_extract(payload, '$.layer_agent.step_id')) * 1.0 / NULLIF(COUNT(*), 0) AS uniqueness
    FROM events
    WHERE event_type='agent_step'
      AND timestamp > ?
    GROUP BY system
    HAVING uniqueness < 0.2 AND COUNT(*) >= 5

- id: AGT-069
  name: "Agent 长时间无产出"
  name_en: "Agent Prolonged No Output"
  layer: agent
  severity: P1
  scope: observable
  applicable: all
  description: "某个已注册系统的最近事件在 10 分钟以前，Agent 可能已失联或推理陷入停滞"
  description_en: "Last event from a registered system was over 10 minutes ago, agent may be disconnected or stalled"
  depends: {"event_types": ["agent_step", "llm_invoke", "tool_call"]}
  always_on: true
  sql_template: |
    SELECT system, MAX(timestamp) as last_seen
        FROM events
        WHERE timestamp > ?
        GROUP BY system
        HAVING MAX(timestamp) < CAST(strftime('\1', '\1', '\1') AS REAL)

- id: SYS-033
  name: "插件启动失败"
  name_en: "Plugin Startup Failed"
  layer: system
  severity: P0
  scope: observable
  applicable: all
  description: "同一插件在 5 分钟内启动失败 ≥ 3 次，插件可能配置错误或依赖缺失"
  description_en: "Same plugin failed to start ≥ 3 times in 5 minutes, plugin may be misconfigured or missing dependencies"
  depends: {"event_types": ["plugin.init_failed"], "fields": ["layer_system.plugin_name"]}
  always_on: true
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.plugin_name') AS plugin,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='plugin.init_failed'
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_system.plugin_name')
    HAVING cnt >= 3

- id: SYS-034
  name: "熔断器频繁切换"
  name_en: "Circuit Breaker Frequent Toggling"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "同一工具在 30 分钟内反复进入 OPEN 状态 ≥ 3 次，下游服务可能不稳定"
  description_en: "Same tool entered OPEN state repeatedly ≥ 3 times in 30 minutes, downstream service may be unstable"
  depends: {"event_types": ["circuit.state_change"], "fields": ["layer_system.to_state", "layer_system.tool"]}
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.tool') AS tool,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='circuit.state_change'
      AND json_extract(payload, '$.layer_system.to_state') = 'OPEN'
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_system.tool')
    HAVING cnt >= 3

- id: SYS-035
  name: "熔断器反复试探失败"
  name_en: "Circuit Breaker Repeated Probing Failed"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "HALF_OPEN → OPEN 说明试探恢复失败，工具可能已不可用"
  description_en: "HALF_OPEN → OPEN indicates probe recovery failed, tool may be unavailable"
  depends: {"event_types": ["circuit.state_change"], "fields": ["layer_system.from_state", "layer_system.to_state", "layer_system.tool"]}
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.tool') AS tool,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='circuit.state_change'
      AND json_extract(payload, '$.layer_system.from_state') = 'HALF_OPEN'
      AND json_extract(payload, '$.layer_system.to_state') = 'OPEN'
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_system.tool')
    HAVING cnt >= 2

- id: SYS-036
  name: "数据库写入故障"
  name_en: "Database Write Failure"
  layer: system
  severity: P0
  scope: observable
  applicable: all
  description: "数据库 flush 操作失败，数据持久化中断，可能丢失诊断记录"
  description_en: "Database flush operation failed, data persistence interrupted, may lose diagnosis records"
  depends: {"event_types": ["db.flush_error"], "fields": ["layer_system.db_mode"]}
  always_on: true
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.db_mode') AS mode,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='db.flush_error'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

- id: SYS-037
  name: "写入队列堆积"
  name_en: "Write Queue Backlog"
  layer: system
  severity: P1
  scope: observable
  applicable: all
  description: "数据库写入队列超过 1000，写入阻塞严重，可能磁盘 I/O 或 SQLite 锁竞争"
  description_en: "Database write queue exceeds 1000, severe write blocking, possible disk I/O or SQLite lock contention"
  depends: {"event_types": ["db.flush_error"], "fields": ["layer_system.queue_size"]}
  sql_template: |
    SELECT system,
           MAX(CAST(json_extract(payload, '$.layer_system.queue_size') AS INTEGER)) AS max_queue
    FROM events
    WHERE event_type='db.flush_error'
      AND timestamp > ?
    GROUP BY system
    HAVING max_queue > 1000

- id: SYS-038
  name: "存储模式降级"
  name_en: "Storage Mode Degraded"
  layer: system
  severity: P2
  scope: observable
  applicable: all
  description: "SQLite 降级为 JSONL 文件模式，数据一致性和查询能力下降，需立即排查 SQLite 状态"
  description_en: "SQLite degraded to JSONL file mode, data consistency and query capability reduced, investigate SQLite status immediately"
  depends: {"event_types": ["db.mode_degraded"], "fields": ["layer_system.mode", "layer_system.reason"]}
  always_on: true
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.reason') AS reason,
           json_extract(payload, '$.layer_system.mode') AS mode,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='db.mode_degraded'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

- id: MEM-083
  name: "记忆只读模式"
  name_en: "Memory Read-Only Mode"
  layer: memory
  severity: P0
  scope: observable
  applicable: all
  description: "番天印哈希链完整性校验失败，记忆进入只读模式，数据不可信需人工修复"
  description_en: "Fantuan seal hash chain integrity check failed, memory entered read-only mode, data untrusted, manual repair needed"
  depends: {"event_types": ["memory.readonly_entered"], "fields": ["layer_system.error_count", "layer_system.reason"]}
  always_on: true
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.reason') AS reason,
           json_extract(payload, '$.layer_system.error_count') AS error_count,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='memory.readonly_entered'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

- id: MEM-084
  name: "记忆频繁只读"
  name_en: "Frequent Memory Read-Only"
  layer: memory
  severity: P1
  scope: observable
  applicable: all
  description: "24 小时内记忆多次进入只读模式，存储介质可能存在持续问题"
  description_en: "Memory entered read-only mode multiple times within 24 hours, storage medium may have persistent issues"
  depends: {"event_types": ["memory.readonly_entered"]}
  sql_template: |
    SELECT system, COUNT(*) AS cnt
    FROM events
    WHERE event_type='memory.readonly_entered'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 2

- id: AGT-070
  name: "P0 推送执行失败"
  name_en: "P0 Push Execution Failed"
  layer: agent
  severity: P0
  scope: observable
  applicable: all
  description: "乾坤镜 P0 诊断推送后，土行孙防御动作执行失败，诊断正确但防御未生效"
  description_en: "After Mingjing P0 diagnosis push, Tusunsun defense action failed to execute, diagnosis correct but defense ineffective"
  depends: {"event_types": ["push.action_failed"], "fields": ["layer_system.action", "layer_system.error", "layer_system.fault_id"]}
  always_on: true
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.fault_id') AS fault_id,
           json_extract(payload, '$.layer_system.action') AS action,
           json_extract(payload, '$.layer_system.error') AS error,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='push.action_failed'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

- id: NET-033
  name: "HTTP 5xx 高频错误"
  name_en: "High Frequency HTTP 5xx Errors"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "HTTP 5xx 错误高频出现，API 服务端可能故障或过载"
  description_en: "HTTP 5xx errors appearing at high frequency, API server may be failing or overloaded"
  depends: {"event_types": ["http.error"], "fields": ["layer_network.status_code", "layer_network.url"]}
  sql_template: |
    SELECT system,
           COUNT(*) AS error_cnt,
           json_extract(payload, '$.layer_network.url') AS url
    FROM events
    WHERE event_type='http.error'
      AND CAST(json_extract(payload, '$.layer_network.status_code') AS INTEGER) >= 500
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_network.url')
    HAVING error_cnt >= 3

- id: NET-034
  name: "HTTP 路由配置错误"
  name_en: "HTTP Route Configuration Error"
  layer: network
  severity: P2
  scope: observable
  applicable: all
  description: "HTTP 404 高频出现，可能存在路由配置错误或客户端请求了不存在的端点"
  description_en: "HTTP 404 appearing at high frequency, possible routing misconfiguration or client requesting non-existent endpoint"
  depends: {"event_types": ["http.error"], "fields": ["layer_network.status_code", "layer_network.url"]}
  sql_template: |
    SELECT system,
           COUNT(*) AS cnt,
           json_extract(payload, '$.layer_network.url') AS url
    FROM events
    WHERE event_type='http.error'
      AND CAST(json_extract(payload, '$.layer_network.status_code') AS INTEGER) = 404
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_network.url')
    HAVING cnt >= 5

- id: NET-035
  name: "飞书 API 限流"
  name_en: "Feishu API Rate Limited"
  layer: network
  severity: P1
  scope: observable
  applicable: all
  description: "飞书 API 返回 429 限流 ≥ 3 次，需检查飞书消息发送频率或调整退避策略"
  description_en: "Feishu API returned 429 rate limit ≥ 3 times, check message sending frequency or adjust backoff strategy"
  depends: {"event_types": ["http.error"], "fields": ["layer_network.status_code", "layer_system.source_plugin"]}
  sql_template: |
    SELECT system, COUNT(*) AS cnt
    FROM events
    WHERE event_type='http.error'
      AND CAST(json_extract(payload, '$.layer_network.status_code') AS INTEGER) = 429
      AND json_extract(payload, '$.layer_system.source_plugin') = 'feishu-adapter'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 3

- id: MDL-041
  name: "模型缓存命中率低"
  name_en: "Low Model Cache Hit Rate"
  layer: model
  severity: P2
  scope: observable
  applicable: all
  description: "超过 90% 的 LLM 调用未命中缓存，可能存在缓存策略失效或上下文变化频繁"
  description_en: "Over 90% of LLM calls missed cache, possible cache strategy failure or frequent context changes"
  depends: {"event_types": ["llm_invoke"], "fields": ["layer_llm.cache_hit"]}
  sql_template: |
    SELECT system,
           SUM(CASE WHEN json_extract(payload, '$.layer_llm.cache_hit') = false THEN 1 ELSE 0 END) AS miss_cnt,
           COUNT(*) AS total_cnt
    FROM events
    WHERE event_type='llm_invoke'
      AND timestamp > ?
    GROUP BY system
    HAVING miss_cnt * 1.0 / NULLIF(total_cnt, 0) > 0.9 AND total_cnt >= 10

- id: TLT-060
  name: "工具输入循环重复"
  name_en: "Tool Input Loop Repetition"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "同一 session 内相同 tool_input_hash 出现 ≥ 5 次，存在工具调用循环风险"
  description_en: "Same tool_input_hash appears ≥ 5 times within the same session, risk of tool call loop"
  depends: {"event_types": ["tool_call"], "fields": ["layer_agent.session_id", "layer_tool.tool_input_hash", "layer_tool.tool_name"]}
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_tool.tool_input_hash') AS input_hash,
           json_extract(payload, '$.layer_tool.tool_name') AS tool,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='tool_call'
      AND json_extract(payload, '$.layer_tool.tool_input_hash') IS NOT NULL
      AND timestamp > ?
    GROUP BY system,
             json_extract(payload, '$.layer_agent.session_id'),
             json_extract(payload, '$.layer_tool.tool_input_hash')
    HAVING cnt >= 5

- id: TLT-061
  name: "工具成功率下降"
  name_en: "Tool Success Rate Decline"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "工具执行成功率低于 50%，工具可能已失效或环境异常"
  description_en: "Tool execution success rate below 50%, tool may be broken or environment abnormal"
  depends: {"event_types": ["tool_call"], "fields": ["layer_tool.tool_name", "layer_tool.tool_ok", "layer_tool.tool_status"]}
  sql_template: |
    SELECT system,
           SUM(CASE WHEN json_extract(payload, '$.layer_tool.tool_ok') = true OR json_extract(payload, '$.layer_tool.tool_status') = 'success' THEN 1 ELSE 0 END) AS ok_cnt,
           SUM(CASE WHEN json_extract(payload, '$.layer_tool.tool_ok') = false OR json_extract(payload, '$.layer_tool.tool_status') = 'fail' THEN 1 ELSE 0 END) AS fail_cnt,
           json_extract(payload, '$.layer_tool.tool_name') AS tool
    FROM events
    WHERE event_type='tool_call'
      AND (json_extract(payload, '$.layer_tool.tool_ok') IS NOT NULL OR json_extract(payload, '$.layer_tool.tool_status') IS NOT NULL)
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_tool.tool_name')
    HAVING fail_cnt * 1.0 / NULLIF(ok_cnt + fail_cnt, 0) > 0.5 AND (ok_cnt + fail_cnt) >= 10

- id: AGT-071
  name: "Agent 组件错误高频"
  name_en: "Agent Component High Error Rate"
  layer: agent
  severity: P2
  scope: observable
  applicable: all
  description: "haotian-lite 组件错误高频 ≥ 5 次，Agent 推理模块可能存在系统性问题"
  description_en: "Haotian-lite component errors high frequency ≥ 5 times, Agent reasoning module may have systemic issues"
  depends: {"event_types": ["error"], "fields": ["component"]}
  sql_template: |
    SELECT system,
           json_extract(payload, '$.component') AS component,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='error'
      AND json_extract(payload, '$.component') = 'haotian-lite'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 5

