    FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
    AND json_extract(payload, '$.layer_memory.chunk_id') IS NOT NULL
    GROUP BY chunk HAVING systems > 1

- id: PRB-077
  name: "业务埋点质量差"
  name_en: "Poor Business Instrumentation Quality"
  layer: probe
  severity: P1
  scope: observable
  applicable: all
  description: "不完整标记事件占比超过 10%，埋点质量差"
  description_en: "Incomplete tagged events exceed 10%, instrumentation quality is poor"
  depends: {"fields": ["_incomplete"]}
  sql_template: |
    SELECT system,
      SUM(CASE WHEN json_extract(payload, '$._incomplete') = 1 THEN 1 ELSE 0 END) as incomplete,
      COUNT(*) as total
    FROM events
    WHERE timestamp > ?
    AND event_type = '__health__'
    GROUP BY system
    HAVING total > 0 AND (incomplete * 100.0 / total) > 10

