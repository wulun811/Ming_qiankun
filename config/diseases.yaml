  description_en: "Frequent role switching within the same session"
  depends: {"event_types": ["role_switch"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='role_switch' AND timestamp > ?
        GROUP BY system HAVING cnt > 5

- id: BIZ-098
  name: "目标达成率低下"
  name_en: "Low Goal Achievement Rate"
  layer: business
  severity: P2
  scope: observable
  applicable: all
  description: "任务完成率低于 50%"
  description_en: "Task completion rate below 50%"
  depends: {"event_types": ["goal_complete"], "fields": ["achieved"]}
  sql_template: |
    SELECT system,
           SUM(CASE WHEN json_extract(payload, '$.achieved') = 1 THEN 1 ELSE 0 END) * 1.0 / COUNT(*) as rate
    FROM events WHERE event_type='goal_complete' AND timestamp > ?
    GROUP BY system HAVING rate < 0.5

- id: BIZ-099
  name: "用户满意度下滑"
  name_en: "Declining User Satisfaction"
  layer: business
  severity: P1
  scope: observable
  applicable: all
  description: "用户负面反馈率上升"
  description_en: "User negative feedback rate rising"
  depends: {"event_types": ["user_feedback"], "fields": ["satisfaction_score"]}
  sql_template: |
    SELECT system,
           AVG(json_extract(payload, '$.satisfaction_score')) as avg_score
    FROM events WHERE event_type='user_feedback' AND timestamp > ?
    GROUP BY system HAVING avg_score < 3.0

- id: BIZ-100
  name: "知识库更新滞后"
  name_en: "Knowledge Base Update Lag"
  layer: business
  severity: P2
  scope: observable
  applicable: all
  description: "知识库超过 1 小时未更新，可能引用过时信息"
  description_en: "Knowledge base not updated for over 1 hour, may reference outdated information"
  depends: {"event_types": ["knowledge_update"]}
  sql_template: |
    SELECT system, MAX(timestamp) as last_update
        FROM events WHERE event_type='knowledge_update'
        AND timestamp > ?
        GROUP BY system HAVING last_update < CAST(strftime('\1', '\1', '\1')
        AS REAL)

