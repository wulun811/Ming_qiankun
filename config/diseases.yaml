- id: MEM-065
  name: "记忆召回为空"
  name_en: "Memory Recall Returns Empty"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "记忆检索返回 0 条结果，索引可能为空或查询不匹配"
  description_en: "Memory retrieval returned 0 results, index may be empty or query mismatched"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='memory_retrieve' AND timestamp > ?
        AND json_extract(payload, '\1') = 0
        GROUP BY system

- id: MEM-066
  name: "记忆查询重复（缓存未做）"
  name_en: "Memory Query Duplication (No Cache)"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "相同查询 1 小时内重复超过 5 次，缓存可能未生效"
  description_en: "Same query repeated over 5 times in 1 hour, cache may not be effective"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, json_extract(payload, '\1')
        as h, COUNT(*) as cnt
        FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system, h HAVING cnt > 5

- id: MEM-067
  name: "记忆相关度全部极低"
  name_en: "All Memory Relevance Extremely Low"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "所有检索结果相关度都低于 0.2，记忆库质量可能有问题"
  description_en: "All retrieval results have relevance below 0.2, memory quality may be problematic"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, AVG(json_extract(payload, '\1'))
        as avg_score
        FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system HAVING avg_score < 0.2

- id: MEM-068
  name: "记忆相关度全部极高"
  name_en: "All Memory Relevance Extremely High"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "所有检索结果相关度都高于 0.95，可能缺乏多样性"
  description_en: "All retrieval results have relevance above 0.95, may lack diversity"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, AVG(json_extract(payload, '\1'))
        as avg_score
        FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system HAVING avg_score > 0.95

- id: MEM-069
  name: "记忆写入失败（有读无写）"
  name_en: "Memory Write Failed (Read Without Write)"
  layer: memory
  severity: P1
  scope: observable
  applicable: all
  description: "有记忆检索但无记忆存储事件，可能写入失败"
  description_en: "Memory retrieval exists but no memory storage event, writes may have failed"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, COUNT(*) as retrieve_cnt FROM events
    WHERE event_type='memory_retrieve' AND timestamp > ?
    AND NOT EXISTS (
      SELECT 1 FROM events e2
      WHERE e2.system = events.system
      AND e2.event_type = 'memory_store'
      AND e2.timestamp > ?
    )
    GROUP BY system HAVING retrieve_cnt > 10

- id: MEM-070
  name: "Embedding 模型漂移"
  name_en: "Embedding Model Drift"
  layer: memory
  severity: P1
  scope: observable
  applicable: all
  description: "同一系统使用多个 embedding 模型，可能导致检索不一致"
  description_en: "Same system using multiple embedding models, may cause retrieval inconsistency"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, COUNT(DISTINCT json_extract(payload, '\1'))
        as model_count
        FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system HAVING model_count > 1

- id: MEM-071
  name: "多轮对话查询理解偏差"
  name_en: "Multi-Turn Query Comprehension Deviation"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "多轮对话中检索相关度趋势下降，查询理解可能偏差"
  description_en: "Retrieval relevance trending down in multi-turn dialogue, query understanding may be drifting"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, AVG(json_extract(payload, '\1'))
        as avg_score
        FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
        AND json_extract(payload, '\1') IS NOT NULL
        GROUP BY system HAVING avg_score < 0.3

- id: MEM-072
  name: "记忆检索不精准"
  name_en: "Inaccurate Memory Retrieval"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "召回数量多但相关度低，向量库可能漂移"
  description_en: "High recall count but low relevance, vector store may have drifted"
  depends: {"event_types": ["memory_retrieve"], "fields": ["layer_memory.relevance_score", "layer_memory.results_count"]}
  sql_template: |
    SELECT system,
           AVG(json_extract(payload, '$.layer_memory.relevance_score')) as avg_score,
           AVG(json_extract(payload, '$.layer_memory.results_count')) as avg_count,
           COUNT(*) as total
    FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
    GROUP BY system HAVING avg_count > 10 AND total > 5

- id: MEM-073
  name: "上下文污染与错误自我复制"
  name_en: "Context Contamination and Error Self-Replication"
  layer: memory
  severity: P1
  scope: observable
  applicable: all
  description: "错误 payload 被多次引用，可能存在上下文污染"
  description_en: "Erroneous payload referenced multiple times, possible context contamination"
  depends: {"event_types": ["memory_retrieve"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
        WHERE event_type='memory_retrieve' AND timestamp > ?
        GROUP BY system HAVING cnt > 50

- id: MEM-074
  name: "记忆时效性管理缺失"
  name_en: "Missing Memory Freshness Management"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "记忆库超过 90 天未更新，可能过时"
  description_en: "Memory store not updated for over 90 days, may be outdated"
  depends: {"event_types": ["memory_retrieve"], "fields": ["layer_memory.memory_store"]}
  sql_template: |
    SELECT system, json_extract(payload, '$.layer_memory.memory_store') as store,
           MAX(timestamp) as last_retrieve
    FROM events WHERE event_type='memory_retrieve'
    GROUP BY system, store HAVING last_retrieve < ?

- id: MEM-075
  name: "上下文隔离失效"
  name_en: "Context Isolation Failure"
  layer: memory
  severity: P0
  scope: observable
  applicable: all
  description: "不同系统召回相同 chunk_id，存在上下文串扰风险"
  description_en: "Different systems recall the same chunk_id, risk of context crosstalk"
  depends: {"event_types": ["memory_retrieve"], "fields": ["layer_memory.chunk_id"]}
  sql_template: |
    SELECT json_extract(payload, '$.layer_memory.chunk_id') as chunk,
           COUNT(DISTINCT system) as systems
    FROM events WHERE event_type='memory_retrieve' AND timestamp > ?
    AND json_extract(payload, '$.layer_memory.chunk_id') IS NOT NULL
    GROUP BY chunk HAVING systems > 1

- id: MEM-076
  name: "记忆隐私泄露"
  name_en: "Memory Privacy Leak"
  layer: memory
  severity: P0
  scope: observable
  applicable: all
  description: "跨用户 chunk_id 召回，可能存在隐私泄露 — 暂不启用（与 MEM-075 同逻辑已禁用，诊断依据需外部上下文）"
  description_en: "Cross-user chunk_id recall, possible privacy leak — disabled (same logic as MEM-075, diagnosis requires external context)"
  depends: {"event_types": ["memory_retrieve"], "fields": ["layer_memory.chunk_id"]}
  sql_template: |
    SELECT json_extract(payload, '$.layer_memory.chunk_id') as chunk,
