    GROUP BY system, session_id
    HAVING cnt > 5

- id: TLT-055
  name: "土行孙工具自愈成功率异常"
  name_en: "Abnormal Tusunsun Tool Self-Healing Rate"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
  description: "土行孙工具代替链中成功恢复的比例低于 50%，建议检查替代工具映射表"
