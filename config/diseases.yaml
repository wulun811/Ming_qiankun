- id: PRB-086
  name: "土行孙探针事件配对异常"
  name_en: "Tusunsun Probe Event Pairing Anomaly"
  layer: probe
  severity: P1
  scope: observable
  applicable: all
  description: "tool.execute 事件在规定时间内没有配对的 tool.result，可能存在工具执行超时或探针事件丢失"
  description_en: "tool.execute event has no matching tool.result within timeout, possible tool execution timeout or probe event loss"
  depends: {"fields": []}
  sql_template: |
    SELECT system,
           COUNT(*) as unfulfilled_cnt FROM expectations
    WHERE system='tusunsun'
      AND fulfilled = 0
      AND deadline > ?
    GROUP BY system
    HAVING unfulfilled_cnt >= 1

