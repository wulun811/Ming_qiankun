  scope: observable
  depends:
    event_types: ["kunxiansuo.schema_error"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_agent.session_id') as session_id,
           COUNT(*) as cnt FROM events
    WHERE event_type='kunxiansuo.schema_error'
      AND timestamp > ?
    GROUP BY system, session_id
    HAVING cnt > 5
  description: LLM 调用土行孙工具时频繁传入不符合 Schema 的参数，建议调整 prompt 或检查工具定义

- id: TLT-055
  name: 土行孙工具自愈成功率异常
  layer: tool
  severity: P2
  scope: observable
  depends:
    event_types: ["kunxiansuo.recovery"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as total,
           SUM(CASE WHEN json_extract(payload, '$.success') = true THEN 1 ELSE 0 END) as success_cnt
    FROM events
    WHERE event_type='kunxiansuo.recovery'
      AND timestamp > ?
    GROUP BY system
    HAVING total > 0 AND CAST(success_cnt AS REAL) / total < 0.5
  description: 土行孙工具代替链中成功恢复的比例低于 50%，建议检查替代工具映射表

- id: SYS-023
  name: 土行孙沙箱入侵告警
  layer: system
  severity: P1
  scope: observable
  depends:
    event_types: ["sandbox.blocked"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_agent.session_id') as session_id,
           COUNT(*) as cnt FROM events
    WHERE event_type='sandbox.blocked'
      AND timestamp > ?
    GROUP BY system, session_id
    HAVING cnt > 2
  description: Agent 尝试访问被土行孙沙箱保护的路径或执行受限命令，达到告警阈值

- id: AGT-065
  name: 土行孙上下文频繁强制裁剪
  layer: agent
  severity: P2
  scope: observable
  depends:
    event_types: ["context.trimmed"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_agent.session_id') as session_id,
           COUNT(*) as cnt FROM events
    WHERE event_type='context.trimmed'
      AND timestamp > ?
    GROUP BY system, session_id
    HAVING cnt > 5
  description: 土行孙会话上下文超出模型限制导致多次强制截断，建议调整 max_tokens 或启用记忆摘要

- id: PRB-086
  name: 土行孙探针事件配对异常
  layer: probe
  severity: P1
  scope: observable
  depends:
    event_types: ["__expect__"]
    fields: []
  sql_template: |
    SELECT system,
           COUNT(*) as unfulfilled_cnt FROM expectations
    WHERE system='tusunsun'
      AND fulfilled = 0
      AND deadline > ?
    GROUP BY system
    HAVING unfulfilled_cnt >= 1
  description: tool.execute 事件在规定时间内没有配对的 tool.result，可能存在工具执行超时或探针事件丢失

# ============================================================
# 十一、土行孙 v0.7 Phase 1 诊断加强（20 个，2026-05-03 追加）
# ============================================================

# --- 捆仙索安全层（+5） ---

- id: SYS-024
  name: 捆仙索反复熔断
  layer: system
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["kunxiansuo.fuse"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='kunxiansuo.fuse'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 2
  description: 捆仙索在短时间窗口内反复触发熔断，核心防御能力不可用

- id: SYS-025
  name: 捆仙索安全系统恢复
  layer: system
  severity: P2
  scope: observable
  depends:
    event_types: ["kunxiansuo.recovered"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='kunxiansuo.recovered'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 捆仙索从故障/熔断状态中恢复，记录恢复事件以监控安全系统稳定性

- id: SYS-026
  name: 捆仙索锚点完全丢失
  layer: system
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["kunxiansuo.anchor_degraded"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='kunxiansuo.anchor_degraded'
      AND json_extract(payload, '$.to_level') >= 3
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 捆仙索锚点降级到极限（硬编码兜底），文件完整性校验强度最低

- id: TLT-056
  name: 重试链升级频繁
  layer: tool
  severity: P1
  scope: observable
  depends:
    event_types: ["kunxiansuo.escalation"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='kunxiansuo.escalation'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 3
  description: 工具代替链频繁升级重试，表明底层工具反复失败

- id: TLT-057
  name: 工具自愈能力退化
  layer: tool
  severity: P2
  scope: observable
  depends:
    event_types: ["kunxiansuo.recovery"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as total,
           SUM(CASE WHEN json_extract(payload, '$.success') = true THEN 1 ELSE 0 END) as success_cnt
    FROM events
    WHERE event_type='kunxiansuo.recovery'
      AND timestamp > ?
    GROUP BY system
    HAVING total > 5 AND CAST(success_cnt AS REAL) / total < 0.4
  description: 工具代替链中成功恢复的比例低于 40%，自愈能力显著退化

# --- 番天印记忆层（+6） ---

- id: MEM-077
  name: 记忆哈希链损坏
  layer: memory
  severity: P0
  scope: observable
  depends:
    event_types: ["ying.hash_verify"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='ying.hash_verify'
      AND json_extract(payload, '$.ok') = false
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 番天印记忆哈希链校验失败，记忆完整性受损

- id: MEM-078
  name: 记忆合并异常
  layer: memory
  severity: P2
  scope: observable
  depends:
    event_types: ["ying.consolidation"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='ying.consolidation'
      AND json_extract(payload, '$.items_merged') = 0
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 番天印记忆层合并操作无产出，跨层转换可能异常

- id: MEM-079
  name: 记忆缓存命中率低
  layer: memory
  severity: P2
  scope: observable
  depends:
    event_types: ["ying.cache_hit"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as total,
           SUM(CASE WHEN json_extract(payload, '$.hit') = false THEN 1 ELSE 0 END) as miss_cnt
    FROM events
    WHERE event_type='ying.cache_hit'
      AND timestamp > ?
    GROUP BY system
    HAVING total > 10 AND CAST(miss_cnt AS REAL) / total > 0.8
  description: 番天印记忆缓存未命中率超过 80%，缓存配置可能需要调整

- id: MEM-080
  name: 记忆召回持续为空
  layer: memory
  severity: P2
  scope: observable
  depends:
    event_types: ["ying.retrieve"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='ying.retrieve'
      AND json_extract(payload, '$.results_count') = 0
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 5
  description: 番天印记忆召回连续 5 次以上无结果，索引或嵌入模型可能存在异常

- id: MEM-081
  name: TusunZip 压缩率退化
  layer: memory
  severity: P2
  scope: observable
  depends:
    event_types: ["ying.tusunzip"]
    fields: []
  sql_template: |
    SELECT system, AVG(json_extract(payload, '$.ratio')) as avg_ratio,
           COUNT(*) as cnt
    FROM events
    WHERE event_type='ying.tusunzip'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 3 AND avg_ratio < 0.3
  description: TusunZip 压缩率连续低于 0.3，压缩效果显著退化

- id: MEM-082
  name: 记忆检索延迟高
  layer: memory
  severity: P2
  scope: observable
  depends:
    event_types: ["ying.retrieve"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='ying.retrieve'
      AND json_extract(payload, '$.latency_ms') > 1000
      AND json_extract(payload, '$.results_count') > 0
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 番天印记忆检索延迟超过 1 秒且有结果返回，检索性能告警

# --- 沙箱层（+3） ---

- id: SYS-027
  name: 沙箱进程被杀
  layer: system
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["sandbox.killed"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='sandbox.killed'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 土行孙沙箱子进程被杀，可能由 OOM Killer 或系统资源耗尽触发

- id: SYS-028
  name: 沙箱执行失败
  layer: system
  severity: P1
  scope: observable
  depends:
    event_types: ["sandbox.result"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='sandbox.result'
      AND json_extract(payload, '$.ok') = false
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 2
  description: 沙箱执行频繁返回失败结果，沙箱内部或执行环境可能存在异常

- id: SYS-029
  name: 沙箱操作频率异常
  layer: system
  severity: P2
  scope: observable
  depends:
    event_types: ["sandbox.execute"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='sandbox.execute'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 50
  description: 沙箱执行操作频率异常偏高，可能存在工具滥用或死循环

# --- 健康与运营层（+4） ---

- id: SYS-030
  name: 健康端点故障
  layer: system
  severity: P1
  scope: observable
  depends:
    event_types: ["health.fail"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='health.fail'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 2
  description: 健康检查端点连续故障，服务可用性受影响

- id: SYS-031
  name: 健康端点严重降级
  layer: system
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["health.degraded"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='health.degraded'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 健康检查出现降级事件，核心服务能力受损需立即关注

- id: AGT-066
  name: 请求生命周期断裂
  layer: agent
  severity: P2
  scope: observable
  depends:
    event_types: ["request.start", "request.end"]
    fields: []
  sql_template: |
    SELECT system,
           SUM(CASE WHEN event_type='request.start' THEN 1 ELSE 0 END) as start_cnt,
           SUM(CASE WHEN event_type='request.end' THEN 1 ELSE 0 END) as end_cnt
    FROM events
    WHERE event_type IN ('request.start', 'request.end')
      AND timestamp > ?
    GROUP BY system
    HAVING start_cnt > end_cnt + 3
  description: 请求 start 事件明显多于 end 事件，存在请求无法正常完成的异常

- id: MDL-039
  name: LLM 空转（无工具调用）
  layer: model
  severity: P1
  scope: observable
  per_system: {"opencode":{"confidence_multiplier":0.3}}
  depends:
    event_types: ["llm_invoke", "tool_call"]
    fields: []
  sql_template: |
    SELECT system,
           SUM(CASE WHEN event_type='llm_invoke' THEN 1 ELSE 0 END) as llm_cnt,
           SUM(CASE WHEN event_type='tool_call' THEN 1 ELSE 0 END) as tool_cnt
    FROM events
    WHERE event_type IN ('llm_invoke', 'tool_call')
      AND timestamp > ?
    GROUP BY system
    HAVING llm_cnt >= 3 AND tool_cnt = 0
  description: LLM 多次调用但无工具调用跟进，可能存在推理循环或死锁

# --- 错误模式层（+23） ---

- id: MDL-040
  name: 模型 API 密钥未配置
  layer: model
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["error"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='error'
      AND (json_extract(payload, '$.error_msg') LIKE '%No API key%'
           OR json_extract(payload, '$.error_msg') LIKE '%no api key%'
           OR json_extract(payload, '$.message') LIKE '%No API key%'
           OR json_extract(payload, '$.message') LIKE '%no api key%')
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 模型 API 密钥未配置或已失效，LLM 调用将全部失败

- id: AGT-067
  name: Agent 达到最大轮次
  layer: agent
  severity: P2
  scope: observable
  depends:
    event_types: ["error"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='error'
      AND (json_extract(payload, '$.error_msg') LIKE '%Max turns%'
           OR json_extract(payload, '$.error_msg') LIKE '%max turns%'
           OR json_extract(payload, '$.message') LIKE '%Max turns%'
           OR json_extract(payload, '$.message') LIKE '%max turns%')
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: Agent 达到最大推理轮次限制，任务被迫中止

# ====================================================================
# v0.11.9-alpha Phase 1: Always-On 实时告警规则（5 条）
# 绕过 triage 30 分钟盲区，每次 archive flush 直通诊断
# ====================================================================

- id: SYS-032
  name: Token 消耗突增
  layer: system
  severity: P1
  always_on: true
  scope: observable
  depends:
    event_types: ["llm_invoke"]
    fields: []
  sql_template: |
    SELECT system,
      SUM(CASE WHEN timestamp > CAST(strftime('%s', 'now', '-5 minutes') AS REAL) THEN json_extract(payload, '$.layer_llm.input_tokens') + json_extract(payload, '$.layer_llm.output_tokens') ELSE 0 END) AS recent_tokens,
      AVG(CASE WHEN timestamp <= CAST(strftime('%s', 'now', '-5 minutes') AS REAL) THEN json_extract(payload, '$.layer_llm.input_tokens') + json_extract(payload, '$.layer_llm.output_tokens') ELSE NULL END) AS baseline_tokens
    FROM events
    WHERE event_type='llm_invoke'
      AND timestamp > ?
    GROUP BY system
    HAVING recent_tokens > baseline_tokens * 3.0 AND baseline_tokens > 0 AND recent_tokens > 1000
  description: 近 5 分钟 Token 消耗超过基准（近 60 分钟均值）的 3 倍，存在调用量异常突增

- id: TLT-058
  name: 危险工具调用
  layer: tool
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["tool_call"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_tool.tool_name') AS tool,
           json_extract(payload, '$.layer_tool.tool_args') AS args,
           json_extract(payload, '$.layer_tool.tool_result') AS result,
           json_extract(payload, '$.layer_tool.tool_status') AS status,
           json_extract(payload, '$.layer_tool.execution_ms') AS exec_ms,
           timestamp
    FROM events
    WHERE event_type='tool_call'
      AND json_extract(payload, '$.layer_tool.tool_name') IN ('rm', 'unlink', 'exec', 'sudo', 'rm_rf', 'git_force_push', 'db_drop', 'chmod_777', 'eval')
      AND timestamp > ?
    ORDER BY timestamp DESC
    LIMIT 50
  description: 检测到 Agent 调用了高风险系统命令或危险操作，可能造成不可逆影响

- id: TLT-059
  name: 工具副作用过大
  layer: tool
  severity: P2
  always_on: true
  scope: observable
  depends:
    event_types: ["tool_call", "agent_step"]
    fields: []
  sql_template: |
    SELECT system,
      SUM(CASE WHEN event_type='tool_call' THEN 1 ELSE 0 END) AS tool_cnt,
      SUM(CASE WHEN event_type='agent_step' THEN 1 ELSE 0 END) AS step_cnt
    FROM events
    WHERE event_type IN ('tool_call', 'agent_step')
      AND timestamp > ?
    GROUP BY system
    HAVING tool_cnt * 1.0 / NULLIF(step_cnt, 0) > 5.0
  description: 工具调用次数超过 Agent 推理步数的 5 倍，工具使用密度过高（文档污染/权限失控前兆）

- id: AGT-068
  name: Step 序列循环
  layer: agent
  severity: P1
  always_on: true
  scope: observable
  depends:
    event_types: ["agent_step"]
    fields: []
  sql_template: |
    SELECT system,
      COUNT(DISTINCT json_extract(payload, '$.layer_agent.step_id')) * 1.0 / NULLIF(COUNT(*), 0) AS uniqueness
    FROM events
    WHERE event_type='agent_step'
      AND timestamp > ?
    GROUP BY system
    HAVING uniqueness < 0.2 AND COUNT(*) >= 5
  description: Agent 推理步骤 ID 去重率低于 20%，存在 step_id 高度重复的死循环迹象

- id: AGT-069
  name: Agent 长时间无产出
  layer: agent
  severity: P1
  always_on: true
  scope: observable
  depends:
    event_types: ["agent_event", "agent_step", "tool_call", "llm_invoke"]
    fields: []
  sql_template: |
    SELECT system, MAX(timestamp) as last_seen
    FROM events
    WHERE timestamp > ?
    GROUP BY system
    HAVING MAX(timestamp) < CAST(strftime('%s', 'now', '-600 seconds') AS REAL)
  description: 某个已注册系统的最近事件在 10 分钟以前，Agent 可能已失联或推理陷入停滞

# ====================================================================
# v0.11.9-alpha Phase 3: 土行孙 v0.8.3 新增 7 种事件类型的诊断规则（16 条）
# 来源：docs/management/土行孙v0.8.3事件反射清单.md
# 日期：2026-05-04
# ====================================================================

# --- 系统层：插件启动 / 熔断器 / 数据库故障 ---

- id: SYS-033
  name: 插件启动失败
  layer: system
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["plugin.init_failed"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.plugin_name') AS plugin,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='plugin.init_failed'
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_system.plugin_name')
    HAVING cnt >= 3
  description: 同一插件在 5 分钟内启动失败 ≥ 3 次，插件可能配置错误或依赖缺失

- id: SYS-034
  name: 熔断器频繁切换
  layer: system
  severity: P1
  scope: observable
  depends:
    event_types: ["circuit.state_change"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.tool') AS tool,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='circuit.state_change'
      AND json_extract(payload, '$.layer_system.to_state') = 'OPEN'
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_system.tool')
    HAVING cnt >= 3
  description: 同一工具在 30 分钟内反复进入 OPEN 状态 ≥ 3 次，下游服务可能不稳定

- id: SYS-035
  name: 熔断器反复试探失败
  layer: system
  severity: P1
  scope: observable
  depends:
    event_types: ["circuit.state_change"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.tool') AS tool,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='circuit.state_change'
      AND json_extract(payload, '$.layer_system.from_state') = 'HALF_OPEN'
      AND json_extract(payload, '$.layer_system.to_state') = 'OPEN'
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_system.tool')
    HAVING cnt >= 2
  description: HALF_OPEN → OPEN 说明试探恢复失败，工具可能已不可用

- id: SYS-036
  name: 数据库写入故障
  layer: system
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["db.flush_error"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.db_mode') AS mode,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='db.flush_error'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 数据库 flush 操作失败，数据持久化中断，可能丢失诊断记录

- id: SYS-037
  name: 写入队列堆积
  layer: system
  severity: P1
  scope: observable
  depends:
    event_types: ["db.flush_error"]
    fields: []
  sql_template: |
    SELECT system,
           MAX(CAST(json_extract(payload, '$.layer_system.queue_size') AS INTEGER)) AS max_queue
    FROM events
    WHERE event_type='db.flush_error'
      AND timestamp > ?
    GROUP BY system
    HAVING max_queue > 1000
  description: 数据库写入队列超过 1000，写入阻塞严重，可能磁盘 I/O 或 SQLite 锁竞争

- id: SYS-038
  name: 存储模式降级
  layer: system
  severity: P2
  always_on: true
  scope: observable
  depends:
    event_types: ["db.mode_degraded"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.reason') AS reason,
           json_extract(payload, '$.layer_system.mode') AS mode,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='db.mode_degraded'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: SQLite 降级为 JSONL 文件模式，数据一致性和查询能力下降，需立即排查 SQLite 状态

# --- 记忆层：番天印只读模式 ---

- id: MEM-083
  name: 记忆只读模式
  layer: memory
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["memory.readonly_entered"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.reason') AS reason,
           json_extract(payload, '$.layer_system.error_count') AS error_count,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='memory.readonly_entered'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 番天印哈希链完整性校验失败，记忆进入只读模式，数据不可信需人工修复

- id: MEM-084
  name: 记忆频繁只读
  layer: memory
  severity: P1
  scope: observable
  depends:
    event_types: ["memory.readonly_entered"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) AS cnt
    FROM events
    WHERE event_type='memory.readonly_entered'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 2
  description: 24 小时内记忆多次进入只读模式，存储介质可能存在持续问题

# --- Agent 层：P0 推送执行故障 ---

- id: AGT-070
  name: P0 推送执行失败
  layer: agent
  severity: P0
  always_on: true
  scope: observable
  depends:
    event_types: ["push.action_failed"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_system.fault_id') AS fault_id,
           json_extract(payload, '$.layer_system.action') AS action,
           json_extract(payload, '$.layer_system.error') AS error,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='push.action_failed'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1
  description: 乾坤镜 P0 诊断推送后，土行孙防御动作执行失败，诊断正确但防御未生效

# --- 网络层：HTTP 错误监控 ---

- id: NET-033
  name: HTTP 5xx 高频错误
  layer: network
  severity: P1
  scope: observable
  depends:
    event_types: ["http.error"]
    fields: []
  sql_template: |
    SELECT system,
           COUNT(*) AS error_cnt,
           json_extract(payload, '$.layer_network.url') AS url
    FROM events
    WHERE event_type='http.error'
      AND CAST(json_extract(payload, '$.layer_network.status_code') AS INTEGER) >= 500
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_network.url')
    HAVING error_cnt >= 3
  description: HTTP 5xx 错误高频出现，API 服务端可能故障或过载

- id: NET-034
  name: HTTP 路由配置错误
  layer: network
  severity: P2
  scope: observable
  depends:
    event_types: ["http.error"]
    fields: []
  sql_template: |
    SELECT system,
           COUNT(*) AS cnt,
           json_extract(payload, '$.layer_network.url') AS url
    FROM events
    WHERE event_type='http.error'
      AND CAST(json_extract(payload, '$.layer_network.status_code') AS INTEGER) = 404
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_network.url')
    HAVING cnt >= 5
  description: HTTP 404 高频出现，可能存在路由配置错误或客户端请求了不存在的端点

- id: NET-035
  name: 飞书 API 限流
  layer: network
  severity: P1
  scope: observable
  depends:
    event_types: ["http.error"]
    fields: []
  sql_template: |
    SELECT system, COUNT(*) AS cnt
    FROM events
    WHERE event_type='http.error'
      AND CAST(json_extract(payload, '$.layer_network.status_code') AS INTEGER) = 429
      AND json_extract(payload, '$.layer_system.source_plugin') = 'feishu-adapter'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 3
  description: 飞书 API 返回 429 限流 ≥ 3 次，需检查飞书消息发送频率或调整退避策略

# --- 模型层：缓存命中率监控 ---

- id: MDL-041
  name: 模型缓存命中率低
  layer: model
  severity: P2
  scope: observable
  depends:
    event_types: ["llm_invoke"]
    fields: []
  sql_template: |
    SELECT system,
           SUM(CASE WHEN json_extract(payload, '$.layer_llm.cache_hit') = false THEN 1 ELSE 0 END) AS miss_cnt,
           COUNT(*) AS total_cnt
    FROM events
    WHERE event_type='llm_invoke'
      AND timestamp > ?
    GROUP BY system
    HAVING miss_cnt * 1.0 / NULLIF(total_cnt, 0) > 0.9 AND total_cnt >= 10
  description: 超过 90% 的 LLM 调用未命中缓存，可能存在缓存策略失效或上下文变化频繁

# --- 工具层：工具成功率 / 输入重复 ---

- id: TLT-060
  name: 工具输入循环重复
  layer: tool
  severity: P1
  scope: observable
  depends:
    event_types: ["tool_call"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.layer_tool.tool_input_hash') AS input_hash,
           json_extract(payload, '$.layer_tool.tool_name') AS tool,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='tool_call'
      AND json_extract(payload, '$.layer_tool.tool_input_hash') IS NOT NULL
      AND timestamp > ?
    GROUP BY system,
             json_extract(payload, '$.layer_agent.session_id'),
             json_extract(payload, '$.layer_tool.tool_input_hash')
    HAVING cnt >= 5
  description: 同一 session 内相同 tool_input_hash 出现 ≥ 5 次，存在工具调用循环风险

- id: TLT-061
  name: 工具成功率下降
  layer: tool
  severity: P2
  scope: observable
  depends:
    event_types: ["tool_call"]
    fields: []
  sql_template: |
    SELECT system,
           SUM(CASE WHEN json_extract(payload, '$.layer_tool.tool_ok') = true OR json_extract(payload, '$.layer_tool.tool_status') = 'success' THEN 1 ELSE 0 END) AS ok_cnt,
           SUM(CASE WHEN json_extract(payload, '$.layer_tool.tool_ok') = false OR json_extract(payload, '$.layer_tool.tool_status') = 'fail' THEN 1 ELSE 0 END) AS fail_cnt,
           json_extract(payload, '$.layer_tool.tool_name') AS tool
    FROM events
    WHERE event_type='tool_call'
      AND (json_extract(payload, '$.layer_tool.tool_ok') IS NOT NULL OR json_extract(payload, '$.layer_tool.tool_status') IS NOT NULL)
      AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.layer_tool.tool_name')
    HAVING fail_cnt * 1.0 / NULLIF(ok_cnt + fail_cnt, 0) > 0.5 AND (ok_cnt + fail_cnt) >= 10
  description: 工具执行成功率低于 50%，工具可能已失效或环境异常

# --- Agent 层：错误归因 ---

- id: AGT-071
  name: Agent 组件错误高频
  layer: agent
  severity: P2
  scope: observable
  depends:
    event_types: ["error"]
    fields: []
  sql_template: |
    SELECT system,
           json_extract(payload, '$.component') AS component,
           COUNT(*) AS cnt
    FROM events
    WHERE event_type='error'
      AND json_extract(payload, '$.component') = 'haotian-lite'
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 5
  description: haotian-lite 组件错误高频 ≥ 5 次，Agent 推理模块可能存在系统性问题
