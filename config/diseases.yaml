- id: TLT-053
  name: "捆仙索工具频繁拦截"
  name_en: "Kunxiansuo Tool Frequent Interception"
  layer: tool
  severity: P1
  scope: observable
  applicable: all
  description: "某 Agent 会话在短时间窗口内被捆仙索多次拦截工具调用，可能存在恶意行为"
  description_en: "An Agent session had tool calls intercepted multiple times by Kunxiansuo in short window, possible malicious behavior"
  depends: {"event_types": ["kunxiansuo.tool_blocked"], "fields": ["layer_agent.session_id"]}
