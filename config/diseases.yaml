  name_en: "Persistent Empty Memory Recall"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "番天印记忆召回连续 5 次以上无结果，索引或嵌入模型可能存在异常"
  description_en: "Fantuan seal memory recall returned no results for 5+ consecutive times, index or embedding model may be abnormal"
  depends: {"event_types": ["ying.retrieve"], "fields": ["results_count"]}
  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='ying.retrieve'
      AND json_extract(payload, '$.results_count') = 0
      AND timestamp > ?
    GROUP BY system
