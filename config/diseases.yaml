  sql_template: |
    SELECT system, COUNT(*) as cnt FROM events
    WHERE event_type='ying.consolidation'
      AND json_extract(payload, '$.items_merged') = 0
      AND timestamp > ?
    GROUP BY system
    HAVING cnt >= 1

- id: MEM-079
  name: "记忆缓存命中率低"
  name_en: "Low Memory Cache Hit Rate"
  layer: memory
  severity: P2
  scope: observable
  applicable: all
  description: "番天印记忆缓存未命中率超过 80%，缓存配置可能需要调整"
  description_en: "Fantuan seal memory cache miss rate exceeds 80%, cache configuration may need adjustment"
  depends: {"event_types": ["ying.cache_hit"], "fields": ["hit"]}
  sql_template: |
    SELECT system, COUNT(*) as total,
           SUM(CASE WHEN json_extract(payload, '$.hit') = false THEN 1 ELSE 0 END) as miss_cnt
    FROM events
    WHERE event_type='ying.cache_hit'
      AND timestamp > ?
    GROUP BY system
    HAVING total > 10 AND CAST(miss_cnt AS REAL) / total > 0.8

- id: MEM-080
