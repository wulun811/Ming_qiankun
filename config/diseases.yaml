    fields: ["layer_agent.session_id"]
  sql_template: |
    SELECT COUNT(DISTINCT system) as systems, COUNT(DISTINCT json_extract(payload, '$.layer_agent.session_id')) as sessions
    FROM events WHERE event_type IN ('agent_step', 'llm_invoke') AND timestamp > ?
    HAVING systems > 2 AND sessions > 10
  description: 多用户事件交织，上下文一致性可能失败

