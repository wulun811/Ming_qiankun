    SELECT system,
           json_extract(payload, '$.layer_agent.session_id') as session_id,
           COUNT(*) as cnt FROM events
    WHERE event_type='kunxiansuo.tool_blocked'
      AND timestamp > ?
    GROUP BY system, session_id
    HAVING cnt > 3

- id: TLT-054
  name: "土行孙 Schema 错误高频"
  name_en: "Tusunsun Schema High Error Rate"
  layer: tool
  severity: P2
  scope: observable
  applicable: all
