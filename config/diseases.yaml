- id: SYS-031
  name: "健康端点严重降级"
  name_en: "Health Endpoint Severe Degradation"
  layer: system
  severity: P0
  scope: observable
  applicable: all
  description: "健康检查出现降级事件，核心服务能力受损需立即关注"
  description_en: "Health check showing degradation events, core service capability impaired, immediate attention needed"
  depends: {"event_types": ["health.degraded"]}
