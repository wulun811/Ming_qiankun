    WHERE event_type='error' AND timestamp > ?
    GROUP BY system, json_extract(payload, '$.error_type') HAVING cnt > 5
  description: 同一错误类型 5 分钟内出现超过 5 次

- id: DQT-087
  name: 堆栈模式重复
  layer: data_quality
  severity: P2
  scope: observable
  applicable: all
  depends:
    event_types: ["error"]
    fields: ["stack_trace"]
  sql_template: |
    SELECT system, json_extract(payload, '$.stack_trace') as stack_trace, COUNT(*) as cnt FROM events
    WHERE event_type='error' AND timestamp > ?
    AND json_extract(payload, '$.stack_trace') IS NOT NULL
    GROUP BY system, json_extract(payload, '$.stack_trace') HAVING cnt > 5
  description: 相同堆栈跟踪频繁出现，可能是同一根因

- id: DQT-088
  name: 数据摄入管道异常
  layer: data_quality
  severity: P2
  scope: observable
  applicable: all
  depends:
    event_types: ["data_ingest"]
    fields: ["doc_count"]
  sql_template: |
    SELECT system, MAX(json_extract(payload, '$.doc_count')) - MIN(json_extract(payload, '$.doc_count')) as doc_range
    FROM events WHERE event_type='data_ingest' AND timestamp > ?
    GROUP BY system HAVING doc_range > 1000
  description: 文档计数突增或突降，数据摄入管道可能异常

- id: DQT-089
  name: 跨会话记忆一致性丢失
